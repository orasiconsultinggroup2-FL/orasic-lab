    <!-- LISTADO DE POSTS -->
    <section class="px-6 pb-24">
        <div class="max-w-3xl mx-auto space-y-6" id="blog-posts">
            <p class="text-slate-400 text-center">Cargando artículos...</p>
        </div>
    </section>

    <script>
        function escHtml(txt) { return (txt || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function renderArticles(articulos) {
            const container = document.getElementById('blog-posts');
            if (!articulos || articulos.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center">No hay artículos publicados aún.</p>';
                return;
            }

            // Filtrar solo artículos publicados
            const published = articulos.filter(a => a.status === 'published');
            if (published.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center">No hay artículos publicados aún.</p>';
                return;
            }

            // Mostrar todos los publicados (más recientes primero)
            container.innerHTML = published.reverse().map(a => {
                const photoFile = a.photoFile || a.sugerencia_imagen || '';
                return `
                    <article class="bg-white/5 border border-white/10 rounded-lg p-12 hover:border-violet-400/40 hover:bg-white/[0.07] transition">
                        ${a.tag ? `<span class="text-sm uppercase tracking-widest text-cyan-400 font-bold">${escHtml(a.tag)}</span>` : ''}
                        <h2 class="text-4xl font-bold text-white mt-4 mb-6">${escHtml(a.title)}</h2>
                        ${a.intro ? `<p class="text-lg text-slate-300 leading-relaxed mb-6 font-semibold">${escHtml(a.intro)}</p>` : ''}
                        ${photoFile ? `<img src="fotos-articulos/${escHtml(photoFile)}" alt="${escHtml(a.title)}" style="margin:32px 0;width:100%;max-height:500px;object-fit:cover;border-radius:8px;" loading="lazy" onerror="this.style.display='none'" />` : ''}
                        <p class="text-base text-slate-300 leading-relaxed" style="line-height:1.8;">${escHtml(a.body || a.body_blog || '').split('\n\n').join('</p><p class="text-base text-slate-300 leading-relaxed" style="line-height:1.8;margin-top:16px;">')}</p>
                    </article>
                `;
            }).join('');
        }

        fetch('./articulos.json')
            .then(r => r.json())
            .then(articulos => {
                // En localhost, mezclar con artículos de localStorage (preview)
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                    const localData = localStorage.getItem('content-studio-state');
                    if (localData) {
                        try {
                            const state = JSON.parse(localData);
                            if (state.blogArticles && Array.isArray(state.blogArticles)) {
                                // Mezclar: priorizar localStorage, luego GitHub
                                articulos = [...state.blogArticles, ...articulos.filter(a => !state.blogArticles.find(b => b.id === a.id))];
                            }
                        } catch (e) { console.warn('No se pudo cargar localStorage'); }
                    }
                }
                renderArticles(articulos);
            })
            .catch(err => {
                console.error('Error cargando artículos:', err);
                // Fallback: intentar cargar solo de localStorage
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                    const localData = localStorage.getItem('content-studio-state');
                    if (localData) {
                        try {
                            const state = JSON.parse(localData);
                            renderArticles(state.blogArticles || []);
                            return;
                        } catch (e) {}
                    }
                }
                document.getElementById('blog-posts').innerHTML = '<p class="text-red-400">Error al cargar artículos.</p>';
            });
    </script>
