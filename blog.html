    <!-- ARTÍCULO DESTACADO -->

    <!-- GALERÍA DE VENTANILLAS PEQUEÑAS -->
    <section class="px-6 pb-24">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-2xl font-bold text-white mb-8">Notas anteriores</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-grid">
                <p class="text-slate-400 col-span-full text-center">Cargando...</p>
            </div>
        </div>
    </section>

    <script>
        function escHtml(txt) {
            return (txt || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function truncate(text, limit = 150) {
            if (!text) return '';
            return text.length > limit ? text.substring(0, limit) + '...' : text;
        }

        function renderFeatured(article) {
            const featured = document.getElementById('featured-article');
            if (!article) {
                featured.innerHTML = '<p class="text-slate-400 text-center">No hay artículos publicados aún.</p>';
                return;
            }

            const photoFile = article.photoFile || article.sugerencia_imagen || '';
            const photoHtml = photoFile
                ? `<img src="fotos-articulos/${escHtml(photoFile)}" alt="${escHtml(article.title)}" class="w-full h-96 object-cover rounded-lg mb-8" loading="lazy" onerror="this.style.display='none'" />`
                : '';

            featured.innerHTML = `
                <article class="bg-white/5 border border-white/10 rounded-lg p-12 hover:border-violet-400/40 hover:bg-white/[0.07] transition">
                    ${article.tag ? `<span class="text-sm uppercase tracking-widest text-cyan-400 font-bold">${escHtml(article.tag)}</span>` : ''}
                    <h1 class="text-5xl font-bold text-white mt-4 mb-6">${escHtml(article.title)}</h1>
                    ${article.intro ? `<p class="text-xl text-slate-300 leading-relaxed mb-8 font-semibold">${escHtml(article.intro)}</p>` : ''}
                    ${photoHtml}
                    <div class="text-base text-slate-300 leading-relaxed" style="line-height:1.8;">
                        ${escHtml(article.body || article.body_blog || '').split('\n\n').map(p => `<p>${p}</p>`).join('')}
                    </div>
                </article>
            `;
        }

        function renderGrid(articles) {
            const grid = document.getElementById('articles-grid');
            if (!articles || articles.length === 0) {
                grid.innerHTML = '<p class="text-slate-400 col-span-full text-center">Sin más artículos.</p>';
                return;
            }

            grid.innerHTML = articles.map(a => {
                const photoFile = a.photoFile || a.sugerencia_imagen || '';
                const photoHtml = photoFile
                    ? `<img src="fotos-articulos/${escHtml(photoFile)}" alt="${escHtml(a.title)}" class="w-full h-40 object-cover rounded-lg mb-4" loading="lazy" onerror="this.style.display='none'" />`
                    : '';

                return `
                    <article class="bg-white/5 border border-white/10 rounded-lg p-6 hover:border-violet-400/40 hover:bg-white/[0.07] hover:scale-105 transition">
                        ${photoHtml}
                        ${a.tag ? `<span class="text-xs uppercase tracking-widest text-cyan-400 font-bold">${escHtml(a.tag)}</span>` : ''}
                        <h3 class="text-lg font-bold text-white mt-2 mb-3 line-clamp-2">${escHtml(a.title)}</h3>
                        <p class="text-sm text-slate-400 line-clamp-2">${truncate(a.intro || a.body || a.body_blog || '', 80)}</p>
                    </article>
                `;
            }).join('');
        }

        function loadArticles() {
            fetch('./articulos.json')
                .then(r => r.json())
                .then(articulos => {
                    // Filtrar solo publicados
                    const published = articulos.filter(a => a.status === 'published');

                    if (published.length === 0) {
                        document.getElementById('featured-article').innerHTML = '<p class="text-slate-400 text-center">No hay artículos publicados aún.</p>';
                        return;
                    }

                    // Ordenar por fecha (más recientes primero)
                    published.sort((a, b) => {
                        const dateA = new Date(a.publishedAt || a.created_at || 0);
                        const dateB = new Date(b.publishedAt || b.created_at || 0);
                        return dateB - dateA;
                    });

                    // Artículo destacado es el primero (más reciente)
                    renderFeatured(published[0]);

                    // Artículos en grid son los demás
                    renderGrid(published.slice(1));
                })
                .catch(err => {
                    console.error('Error loading articles:', err);
                    document.getElementById('featured-article').innerHTML = '<p class="text-red-400">Error al cargar artículos.</p>';
                });
        }

        // Cargar artículos al abrir la página
        loadArticles();
    </script>
