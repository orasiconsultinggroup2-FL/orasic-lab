// Carga en lote: encadena el modal de números por todas las piezas publicadas
// que aún les falte algo, para que sea una sola sesión (ej. "los lunes 10 min")
// en vez de perseguir el botón pieza por pieza cada vez que se publica algo.
// ═══════════════════════════════════════════════════════════
//  SINCRONIZACIÓN CON INSTAGRAM (Meta Graph API)
// ═══════════════════════════════════════════════════════════
// El token se guarda solo en localStorage de este navegador — nunca viaja al
// repositorio ni al servidor. Es un token de larga duración (~60 días) generado
// a mano en Meta for Developers; hay que renovarlo cuando venza.
const IG_TOKEN_KEY = 'orasic_ig_token';
const IG_ACCOUNT_KEY = 'orasic_ig_account_id';
const IG_API_VERSION = 'v21.0';

function getIgToken(){ return localStorage.getItem(IG_TOKEN_KEY) || ''; }
function setIgToken(t){ localStorage.setItem(IG_TOKEN_KEY, t); }

// La cuenta de Instagram Business detrás del token se resuelve una sola vez
// (vía la Página de Facebook enlazada) y se cachea — no cambia entre sesiones.
async function resolveIgAccountId(token){
  const cached = localStorage.getItem(IG_ACCOUNT_KEY);
  if (cached) return cached;
  const pagesRes = await fetch(`https://graph.facebook.com/${IG_API_VERSION}/me/accounts?access_token=${encodeURIComponent(token)}`);
  const pagesData = await pagesRes.json();
  if (pagesData.error) throw new Error(pagesData.error.message);
  const page = (pagesData.data || [])[0];
  if (!page) throw new Error('No se encontró ninguna Página de Facebook enlazada a este token.');
  const igRes = await fetch(`https://graph.facebook.com/${IG_API_VERSION}/${page.id}?fields=instagram_business_account&access_token=${encodeURIComponent(token)}`);
  const igData = await igRes.json();
  if (igData.error) throw new Error(igData.error.message);
  const igId = igData.instagram_business_account && igData.instagram_business_account.id;
  if (!igId) throw new Error('La Página no tiene una cuenta de Instagram Business enlazada.');
  localStorage.setItem(IG_ACCOUNT_KEY, igId);
  return igId;
}

async function fetchIgMedia(token, igId){
  const fields = 'id,caption,timestamp,media_product_type,permalink,like_count,comments_count';
  const res = await fetch(`https://graph.facebook.com/${IG_API_VERSION}/${igId}/media?fields=${fields}&limit=25&access_token=${encodeURIComponent(token)}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.data || [];
}

// Los nombres de métricas de Insights difieren entre Reels y posts normales de feed.
async function fetchIgInsights(token, mediaId, esReel){
  const metrics = esReel ? 'reach,likes,comments,saved,shares,views' : 'reach,likes,comments,saved,shares';
  const res = await fetch(`https://graph.facebook.com/${IG_API_VERSION}/${mediaId}/insights?metric=${metrics}&access_token=${encodeURIComponent(token)}`);
  const data = await res.json();
  if (data.error) return { _error: data.error.message };
  const out = {};
  (data.data || []).forEach(m => { out[m.name] = m.values && m.values[0] ? m.values[0].value : undefined; });
  return out;
}

function openInstagramSync(){
  const ov = document.createElement('div');
  ov.className = 'vs-overlay';
  ov.innerHTML = `
    <div class="vs-modal" style="max-width:640px;">
      <div class="vs-head">
        <div class="vs-title">🔄 Sincronizar Instagram</div>
        <button class="btn btn-secondary btn-sm" id="ig-close">✕</button>
      </div>
      <div id="ig-body"></div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#ig-close').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  const body = ov.querySelector('#ig-body');

  function renderTokenForm(msg){
    const guardado = getIgToken();
    body.innerHTML = `
      ${msg ? `<div class="perf-falta" style="margin-bottom:10px;">${escHtml(msg)}</div>` : ''}
      <div class="vs-sub" style="margin-bottom:10px;">Pega tu token de acceso de larga duración de Meta. Se guarda solo en este navegador (localStorage), nunca en el repositorio.</div>
      <textarea id="ig-token-input" class="form-input" rows="3" style="font-family:monospace;font-size:11.5px;margin-bottom:10px;" placeholder="EAAxxxxxxxx...">${escHtml(guardado)}</textarea>
      <button class="btn btn-primary" id="ig-save-token">Guardar y sincronizar</button>
    `;
    body.querySelector('#ig-save-token').onclick = () => {
      const t = body.querySelector('#ig-token-input').value.trim();
      if (!t) return;
      setIgToken(t);
      runSync(t);
    };
  }

  async function runSync(token){
    body.innerHTML = `<div class="vs-sub">Conectando con Instagram…</div>`;
    try {
      const igId = await resolveIgAccountId(token);
      body.innerHTML = `<div class="vs-sub">Trayendo publicaciones…</div>`;
      const media = await fetchIgMedia(token, igId);
      if (!media.length){ body.innerHTML = `<div class="perf-falta">No se encontraron publicaciones en esta cuenta de Instagram.</div>`; return; }
      body.innerHTML = `<div class="vs-sub">Trayendo estadísticas de ${media.length} publicaciones…</div>`;
      for (const m of media) m._insights = await fetchIgInsights(token, m.id, m.media_product_type === 'REELS');
      renderMatchList(media);
    } catch (e){
      renderTokenForm('Error: ' + e.message + ' — revisa el token o vuelve a generarlo (puede haber vencido).');
    }
  }

  function renderMatchList(media){
    const candidatos = state.items
      .filter(i => i.status === 'published' && redesDe(i).includes('Instagram'))
      .sort((a,b) => (b.scheduleDate||'').localeCompare(a.scheduleDate||''));
    media.sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||''));
    body.innerHTML = `
      <div style="font-size:11.5px;color:var(--text-2);margin-bottom:8px;">
        ${media.length} publicaciones traídas. Revisa que cada una apunte a la pieza correcta antes de guardar.
      </div>
      <div style="max-height:320px;overflow-y:auto;">
        ${media.map((m,ix) => {
          const ins = m._insights || {};
          return `
          <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text-3);width:190px;flex-shrink:0;">
              ${ins._error ? `<span style="color:var(--orange);">⚠ ${escHtml(ins._error)}</span>` : `👁${ins.reach ?? '—'} · ❤${m.like_count ?? '—'} · 💬${m.comments_count ?? '—'} · 🔖${ins.saved ?? '—'}`}
            </div>
            <select class="form-input" id="ig-row-${ix}" style="flex:1;font-size:12px;">
              <option value="">— Omitir —</option>
              ${candidatos.map((c,cx) => `<option value="${c.id}" ${cx===ix?'selected':''}>${escHtml((c.scheduleDate||'').slice(5))} · ${escHtml((c.topic||'').slice(0,50))}</option>`).join('')}
            </select>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn btn-primary" id="ig-save">💾 Guardar</button>
        <button class="btn btn-secondary" id="ig-relogin">Cambiar token</button>
      </div>
    `;
    body.querySelector('#ig-relogin').onclick = () => renderTokenForm();
    body.querySelector('#ig-save').onclick = () => {
      let guardadas = 0;
      media.forEach((m,ix) => {
        const id = document.getElementById('ig-row-'+ix).value;
        if (!id) return;
        const it = state.items.find(x => x.id === id);
        if (!it) return;
        const cur = getMetrics(it, 'Instagram') || {};
        const ins = m._insights || {};
        guardarSnapshot(it, 'Instagram', {
          views: ins.views ?? ins.reach ?? cur.views,
          likes: m.like_count ?? cur.likes,
          comments: m.comments_count ?? cur.comments,
          saves: ins.saved ?? cur.saves,
          shares: ins.shares ?? cur.shares
        });
        guardadas++;
      });
      saveState(); close(); render();
      if (typeof showToast === 'function') showToast(`✅ ${guardadas} pieza${guardadas===1?'':'s'} de Instagram actualizada${guardadas===1?'':'s'}`,'success');
    };
  }

  const guardado = getIgToken();
  if (guardado) runSync(guardado); else renderTokenForm();
}

// Interpreta el texto que sale al copiar la tabla de TikTok Studio → Publicaciones.
// Formato real (verificado): por fila, duración "mm:ss", política de privacidad,
// vistas, me gusta, comentarios — separados por líneas en blanco, mezclado con los
// encabezados de columna que hay que descartar.
function parseTikTokPaste(text){
  const SKIP = new Set([
    'Visualizaciones','Me gusta','Comentarios','Política de privacidad',
    'Buscar la descripción de la publicación','Contenido (Creada el)','Acciones'
  ]);
  const lines = text.split('\n').map(l => l.trim()).filter(l => l && !SKIP.has(l));
  const rows = [];
  let i = 0;
  while (i < lines.length){
    if (/^\d{1,2}:\d{2}$/.test(lines[i]) && i+4 < lines.length &&
        /^\d+$/.test(lines[i+2]) && /^\d+$/.test(lines[i+3]) && /^\d+$/.test(lines[i+4])){
      const [mm,ss] = lines[i].split(':').map(Number);
      rows.push({ duration: lines[i], durationSec: mm*60+ss, views:+lines[i+2], likes:+lines[i+3], comments:+lines[i+4] });
      i += 5;
    } else {
      i += 1; // línea desalineada (encabezado no reconocido, etc.) — se salta y se reintenta
    }
  }
  return rows;
}

function openTikTokPaste(){

  ov.className = 'vs-overlay';
  ov.innerHTML = `
    <div class="vs-modal" style="max-width:640px;">
      <div class="vs-head">

      <textarea id="tp-textarea" class="form-input" rows="8" style="margin:10px 0;font-family:monospace;font-size:11.5px;" placeholder="Pega aquí el texto copiado de la tabla..."></textarea>

    </div>`;
  document.body.appendChild(ov);

  ov.querySelector('#tp-parse').onclick = () => {
    const text = ov.querySelector('#tp-textarea').value;
    const rows = parseTikTokPaste(text);
    const body = ov.querySelector('#tp-body');
    if (!rows.length){
      body.innerHTML = `<div class="perf-falta">No reconocí ninguna fila. Verifica que copiaste la tabla completa (con los números de Visualizaciones, Me gusta y Comentarios).</div>`;
      return;
    }
    const candidatos = state.items
      .filter(i => i.status === 'published' && redesDe(i).includes('TikTok'))
      .sort((a,b) => (b.scheduleDate||'').localeCompare(a.scheduleDate||'')); // más reciente primero, igual que la tabla
    body.innerHTML = `
      <div style="font-size:11.5px;color:var(--text-2);margin-bottom:8px;">
        ${rows.length} fila${rows.length===1?'':'s'} reconocida${rows.length===1?'':'s'}. Revisa que cada una apunte a la pieza correcta antes de guardar.

            <div style="font-size:11px;color:var(--text-3);width:190px;flex-shrink:0;">👁${r.views} · ❤${r.likes} · 💬${r.comments} · ⏱${r.duration}</div>
            <select class="form-input" id="tp-row-${ix}" style="flex:1;font-size:12px;">
              <option value="">— Omitir —</option>
              ${candidatos.map((c,cx) => `<option value="${c.id}" ${cx===ix?'selected':''}>${escHtml((c.scheduleDate||'').slice(5))} · ${escHtml((c.topic||'').slice(0,50))}</option>`).join('')}
            </select>
          </div>`).join('')}
      </div>
      <button class="btn btn-primary" id="tp-save" style="margin-top:12px;">💾 Guardar ${rows.length} fila${rows.length===1?'':'s'}</button>
    `;
    body.querySelector('#tp-save').onclick = () => {
      let guardadas = 0;
      rows.forEach((r,ix) => {
        const id = document.getElementById('tp-row-'+ix).value;
        if (!id) return;
        const it = state.items.find(x => x.id === id);
        if (!it) return;
        guardarSnapshot(it, 'TikTok', { views:r.views, likes:r.likes, comments:r.comments, duration:r.durationSec });
        guardadas++;
      });
      saveState(); close(); render();
      if (typeof showToast === 'function') showToast(`✅ ${guardadas} pieza${guardadas===1?'':'s'} actualizada${guardadas===1?'':'s'}`,'success');
    };
  };
}

function openMetricsQueue(){
  const publicadas = state.items
    .filter(i => i.status === 'published')
    .sort((a,b) => (a.scheduleDate||'').localeCompare(b.scheduleDate||''));
  const cola = publicadas.filter(i => redesDe(i).some(n => !getMetrics(i, n))).map(i => i.id);
  if (!cola.length){ if (typeof showToast === 'function') showToast('Ya está todo cargado 🎉','success'); return; }
  openMetrics(cola[0], cola.slice(1));
}

function openMetrics(id, cola){
  const it = state.items.find(x => x.id === id);

  const enCola = Array.isArray(cola);

    <div class="vs-modal" style="max-width:560px;">

      </div>
      ${nets.map((n,ix)=>`
        <div class="mx-panel" data-net="${n}" style="${ix?'display:none':''}">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;">
            ${METRIC_FIELDS.map(f=>{
              const val = (m[n]&&m[n][f.k]!==undefined) ? escAttr(String(m[n][f.k])) : '';
              return `<div>
                <label class="form-label" style="font-size:11px;">${f.label}</label>
                <input class="form-input" type="number" min="0" step="${f.step||'1'}" id="mx-${n}-${f.k}" value="${val}" placeholder="0" />
                ${f.hint?`<div style="font-size:10px;color:var(--text-3);margin-top:2px;">${f.hint}</div>`:''}
              </div>`;
            }).join('')}
          </div>
          ${(m[n] && m[n].history && m[n].history.length > 1) ? `
            <div style="margin-bottom:14px;">
              <div style="font-size:11px;font-weight:700;color:var(--violet);letter-spacing:.05em;margin-bottom:6px;">HISTORIAL (${m[n].history.length} registros)</div>
              <div style="max-height:120px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;">
                ${m[n].history.slice().reverse().map(h => `
                  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);padding:3px 0;">
                    <span>${fmtDate(new Date(h.date))}</span>
                    <span>👁 ${(Number(h.views)||0).toLocaleString('es')} · ❤ ${h.likes ?? '—'} · 💬 ${h.comments ?? '—'}</span>
                  </div>`).join('')}
              </div>
            </div>` : ''}
        </div>`).join('')}
      <label style="display:flex;align-items:flex-start;gap:9px;background:var(--bg-card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:12px;cursor:pointer;">
        <input type="checkbox" id="mx-excluir" ${it.excluirDeBase?'checked':''} style="margin-top:2px;accent-color:var(--violet);" />
        <span style="font-size:12px;color:var(--text-2);line-height:1.5;">
          <b style="color:var(--text-1);">No contar para el promedio</b><br>
          Márcalo en las primeras piezas: TikTok reparte un lote de prueba de 400-500 vistas a las cuentas nuevas
          que no refleja la calidad. Se siguen viendo, pero no distorsionan tu línea base.
        </span>
      </label>
      <div style="font-size:11.5px;color:var(--text-2);margin-bottom:12px;">
        Cada red se mide por separado. Puedes llenar solo una y guardar; la otra queda pendiente.

      </div>

        <button class="btn btn-primary" id="mx-save">💾 ${enCola && cola.length ? 'Guardar y siguiente →' : 'Guardar y diagnosticar'}</button>

  };
}

// LinkedIn no soporta negrita real — el truco es usar el bloque Unicode "Mathematical Bold",
// que se ve en negrita en cualquier plataforma sin necesitar formato HTML/markdown.
// Tildes y ñ no tienen equivalente en ese bloque, así que quedan sin negrita (limitación del truco, no un bug).
function toBoldUnicode(str){
  let out = '';
  for (const ch of str){
    const code = ch.codePointAt(0);
    if (code>=65&&code<=90) out += String.fromCodePoint(0x1D400 + (code-65));       // A-Z
    else if (code>=97&&code<=122) out += String.fromCodePoint(0x1D41A + (code-97)); // a-z
    else if (code>=48&&code<=57) out += String.fromCodePoint(0x1D7CE + (code-48));  // 0-9
    else out += ch;
  }
  return out;
}

function copyArticle(id){
  const a = state.linkedinArticles.find(x=>x.id===id); if(!a) return;
  let text = `${toBoldUnicode(a.title)}\n\n${a.body}\n\n${a.hashtags||''}`.trim();
  // Agregar instrucción de foto al final si existe
  if (a.photoFile) {
    text += `\n\n---\n📷 Foto: fotos-articulos/${a.photoFile}\n\n💡 Paso: En LinkedIn, clic en "📷 Agregar imagen" → navega a fotos-articulos/ → selecciona ${a.photoFile}`;
  }
  navigator.clipboard.writeText(text).then(()=>{ if(typeof showToast==='function') showToast(a.photoFile ? '✓ Copiado + instrucciones de foto' : '✓ Copiado','success'); });
}

const BLOG_URL = '/blog.html';

async function importSeedArticles(){
  try {
    const res = await fetch('/api/articles-published?t=' + Date.now());
    if (!res.ok) throw new Error('No se pudo conectar al servidor');
    const allArticles = await res.json();

    // Filtrar por plataforma y limpiar arrays antes de importar
    state.linkedinArticles = allArticles.filter(a => a.plataforma === 'LinkedIn');
    state.blogArticles = allArticles.filter(a => a.plataforma === 'Blog');

    const added = state.linkedinArticles.length + state.blogArticles.length;
    saveState(); render();
    if (typeof showToast==='function') showToast(added ? `✅ ${added} artículos cargados` : 'Error en carga','success');
  } catch(e){
    alert('No se pudo cargar los artículos. Verifica que el servidor esté corriendo (node server.js en puerto 5051).');
  }
}

    }).catch(err => {
      alert('Error al publicar: ' + err.message);
      btn.disabled = false;
      btn.textContent = '✓ Publicar en Blog';
    });
  };

async function generateContentAsync(overrideState) {
  const s = overrideState || wizardState;
  const st = state.settings;
  const gen = {};

  if (st.claudeKey) {
    // Real Claude API generation
    try {
      const prompt = buildClaudePrompt(s, st);
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': st.claudeKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 4096,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `Error ${response.status}`);
      }

      const data = await response.json();
      const raw = data.content[0].text;

      // Parse JSON block from response
      const jsonMatch = raw.match(/```json\s*([\s\S]*?)\s*```/) || raw.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        const parsed = JSON.parse(jsonMatch[1] || jsonMatch[0]);
        s.platforms.forEach(p => { if (parsed[p]) gen[p] = parsed[p]; });
      }

      // Fallback per platform if parse failed
      s.platforms.forEach(p => { if (!gen[p]) gen[p] = generateTemplate(p, s, st); });

    } catch(e) {
      console.error('Claude API error:', e);
      showToast(`⚠️ Claude API: ${e.message}. Usando plantillas.`, 'error');
      s.platforms.forEach(p => { gen[p] = generateTemplate(p, s, st); });
    }
  } else {
    // Template-based generation
    s.platforms.forEach(p => { gen[p] = generateTemplate(p, s, st); });
  }

  return gen;
}

function buildClaudePrompt(s, st) {
  const pillarInstructions = {
    'Mito vs Realidad': `Estructura OBLIGATORIA: Empieza con el MITO en negativo/tachado (❌ Mito: ...), luego la REALIDAD con datos o evidencia (✅ Realidad: ...). Termina con el impacto concreto. Máx 5 tarjetas si es Silencioso.`,
    'Antes/Después': `Estructura OBLIGATORIA: ANTES (caos, dolor, pérdida de tiempo/dinero) → DESPUÉS (sistema, claridad, resultado). Sé específico con el rubro. Usa contraste visual. El ANTES debe doler, el DESPUÉS debe aliviar.`,
    'Números': `Usa cifras reales y concretas de ORASIC Lab: +100 apps construidas, 12 rubros, Perú y Colombia, semanas no meses. Los números deben ser el protagonista. Formatos como "100 apps / 12 rubros / 2 países / 1 decisión".`,
    'Tips': `Da 3 señales, 3 errores, o 3 pasos concretos y accionables. Cada tip debe ser independiente y útil. El gancho debe ser una pregunta o afirmación que golpee directo al dolor del dueño de negocio.`,
    'Rubro del día': `El rubro específico es el protagonista: ${s.rubro}. Habla directamente a ese dueño de negocio. Usa su lenguaje, sus problemas diarios, sus herramientas actuales (cuaderno, WhatsApp, Excel). Muestra la transformación específica para ese rubro.`,
    'Detrás de cámara': `Tono auténtico y humano, como si mostraras el backstage. Primera persona o segunda persona directa. Genera curiosidad sobre el proceso interno de ORASIC Lab. Sin corporativo, sin marketing — honesto y cercano.`,
    'Objeciones': `La objeción es el título/gancho (en forma de pregunta). Responde con empatía primero, luego con evidencia. Nunca dismisses la duda — valídala y luego voltéala. Termina con una invitación sin presión.`
  };

  const formatInstructions = s.formato === 'Silencioso'
    ? `FORMATO: SILENCIOSO (sin locución). El contenido son TARJETAS DE TEXTO que aparecen en pantalla.
       - Cada tarjeta: máx 10 palabras, leíble en 1.5 segundos.

  const pillarInstruction = pillarInstructions[s.pilar] || '';

  return `Eres un experto en copywriting publicitario, marketing de contenidos y conversión para redes sociales. Especializas en contenido para TikTok e Instagram dirigido a dueños de negocios pyme en Latinoamérica.

${pillarInstruction ? `INSTRUCCIONES ESPECÍFICAS PARA ESTE PILAR:\n${pillarInstruction}\n` : ''}

// Deja solo el texto publicable: quita marcadores [HOOK], [CTA], [CARD 1], indicaciones de segundos y líneas de "Visual:"
function cleanScript(t){
  return t.split('\n')
    .map(l => l.replace(/^\s*\[[^\]]*\]\s*/,''))       // quita el marcador [..] al inicio de la línea
    .filter(l => !/^\s*→?\s*visual\s*:/i.test(l))       // quita indicaciones de "Visual:"
    .join('\n')
    .replace(/\n{3,}/g,'\n\n')

}

// Junta los bloques publicables (caption + hashtags, o post + hashtags, o el artículo) en un solo texto listo para pegar
function copyAll(btn){
  const panel = btn.closest('.gen-panel-inner');
  const types = (btn.dataset.paste||'').split(',').filter(Boolean);
  const parts = [];
  types.forEach(ty => {

// Convierte el guion en una lista de tarjetas de texto
function scriptToCards(script){
  const clean = (script||'').replace(/^\s*→?\s*visual\s*:[^\n]*$/gim,'');
  const lines = clean.split('\n');
  const cards = [];
  let buf = [];
  const flush = () => { const t = buf.join('\n').replace(/\n{2,}/g,'\n').trim(); if(t) cards.push(t); buf = []; };
  for (const raw of lines){
    const l = raw.trim();
    const brk = l.match(/^\[[^\]]*\]\s*(.*)$/);                       // [CARD 1] texto  /  [HOOK ...]
    const sld = l.match(/^(?:slide|card|diapositiva)\s*\d+[^:]*:\s*(.*)$/i); // Slide 1 (Portada): texto
    if (brk){ flush(); if (brk[1].trim()) buf.push(brk[1].trim()); }
    else if (sld){ flush(); if (sld[1].trim()) buf.push(sld[1].trim()); }
    else if (!l){ if (buf.length) buf.push(''); }
    // Quita SOLO viñetas reales (• - "1." "2)"), no números que son parte del texto ("3 señales")
    else { buf.push(l.replace(/^(?:[•·▪‣*–—-]\s+|\d+[.)]\s+)/,'').trim()); }
  }
  flush();
  return _vsSplitLong(cards.filter(Boolean));
}

// Parte tarjetas demasiado largas para que ninguna tenga más de ~14 palabras (mejor lectura en video)
function _vsSplitLong(cards){
  const MAX = 14;
  const out = [];
  for (const c of cards){
    if (c.split(/\s+/).length <= MAX){ out.push(c); continue; }
    // Cada salto de línea del guion es también un corte válido: sin esto se
    // pegaban dos frases en una tarjeta ("...sola pantalla En semanas...").
    const sents = c.split('\n').flatMap(l => l.split(/(?<=[.!?✅])\s+/)).filter(x=>x.trim());
    let cur = '';
    for (const s of sents){
      const merged = cur ? cur + ' ' + s : s;
      if (merged.split(/\s+/).length > MAX && cur){ out.push(cur.trim()); cur = s; }
      else cur = merged;
    }
    if (cur.trim()) out.push(cur.trim());
  }
  // Último recurso: cualquier tarjeta aún larga se parte por palabras
  const final = [];
  for (const c of out){
    const w = c.split(/\s+/);
    if (w.length <= MAX + 4){ final.push(c); continue; }
    for (let i=0; i<w.length; i+=MAX) final.push(w.slice(i, i+MAX).join(' '));
  }
  return final;
}

function _vsPickMime(withAudio){
  const cands = withAudio
    ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    : ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for (const m of cands){ if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}

    const approved = all.filter(v => APPROVED_VOICES.some(a => v.name.toLowerCase().includes(a)));
    const list = approved.length ? approved : all;
    state.settings.elevenKey = key;
    // Fusiona con las que agregaste a mano, sin duplicar ni borrarlas
    const existing = state.settings.elevenVoices || [];
    const merged = existing.slice();
    let added = 0;
    for (const v of list){ if (!merged.some(m => m.id === v.id)){ merged.push(v); added++; } }
    state.settings.elevenVoices = merged;
    if (!state.settings.elevenVoice && merged[0]) state.settings.elevenVoice = merged[0].id;
    saveState();
    render();
    const st2 = document.getElementById('voices-status');
    if (st2){
      st2.style.color = added ? 'var(--green)' : 'var(--text-2)';
      st2.textContent = added
        ? `✓ ${added} voz(ces) agregada(s)${approved.length?' — aprobadas encontradas':''}`
        : 'Sin voces nuevas (ya estaban todas).';
    }
  } catch(e){
    if (st){ st.style.color='var(--red)'; st.textContent = 'Error: ' + e.message; }
  }
}

// Aplica las reglas de pronunciación SOLO al texto que se manda a la voz.
// Lo que se ve en las tarjetas del video no cambia.
const _DIGIT_ES = {'0':'cero','1':'uno','2':'dos','3':'tres','4':'cuatro','5':'cinco','6':'seis','7':'siete','8':'ocho','9':'nueve'};

// Números 0-99 en palabras (para el código de país: +51 → "cincuenta y uno")
function _twoDigitEs(n){
  const u = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
  const t = {10:'diez',11:'once',12:'doce',13:'trece',14:'catorce',15:'quince',16:'dieciséis',17:'diecisiete',18:'dieciocho',19:'diecinueve',20:'veinte',21:'veintiuno',22:'veintidós',23:'veintitrés',24:'veinticuatro',25:'veinticinco',26:'veintiséis',27:'veintisiete',28:'veintiocho',29:'veintinueve'};
  const d = {3:'treinta',4:'cuarenta',5:'cincuenta',6:'sesenta',7:'setenta',8:'ochenta',9:'noventa'};
  if (n < 10) return u[n];
  if (t[n]) return t[n];
  const dec = Math.floor(n/10), uni = n%10;
  return d[dec] + (uni ? ' y ' + u[uni] : '');
}

// Convierte una secuencia larga de dígitos (teléfono) a palabras en español.
// Los dígitos sueltos hacen que la voz cambie a inglés; deletrearlos lo evita.
// Dentro de cada grupo van sin coma (para que fluya) y las comas separan grupos,
// dando la pausa justa para que quien mira el video pueda anotar el número.
function _phoneToSpanish(match){
  const plus = /^\s*\+/.test(match);
  let groups = match.replace(/^\s*\+/,'').split(/[\s\-().]+/).filter(Boolean);
  let prefix = '';
  if (plus && groups.length > 1 && groups[0].length <= 2){
    prefix = 'más ' + _twoDigitEs(parseInt(groups[0],10)) + ', ';
    groups = groups.slice(1);
  } else if (plus) {
    prefix = 'más ';
  }
  const spoken = groups
    .map(g => g.split('').map(d => _DIGIT_ES[d] || d).join(' '))
    .join(', ');
  return prefix + spoken;
}

function applyPronunciation(text){
  const raw = state.settings.pronunciations || '';
  const rules = raw.split('\n')
    .map(l => l.split('='))
    .filter(p => p.length === 2 && p[0].trim())
    .map(p => ({ from: p[0].trim(), to: p[1].trim() }))
    .sort((a,b) => b.from.length - a.from.length);  // primero las frases largas
  let out = text;
  for (const r of rules){
    const esc = r.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out = out.replace(new RegExp(esc, 'gi'), r.to);
  }
  // Teléfonos y números largos: al menos 7 dígitos en el bloque
  out = out.replace(/\+?\d[\d\s\-().]{5,}\d/g, m => {
    const digits = (m.match(/\d/g)||[]).length;
    return digits >= 7 ? _phoneToSpanish(m) : m;
  });
  return out;
}

// Genera el audio de la narración. Devuelve un Blob de audio.
async function elevenTTS(text, voiceId, key){
  const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method: 'POST',
    headers: { 'xi-api-key': key, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
    body: JSON.stringify({
      text,
      model_id: 'eleven_multilingual_v2',
      voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.0, use_speaker_boost: true }
    })
  });
  if (!r.ok){
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.detail) msg += ' — ' + (j.detail.message || j.detail.status || JSON.stringify(j.detail)); } catch(_){}
    if (r.status === 401) msg += ' (clave inválida)';
    if (r.status === 429) msg += ' (cuota mensual agotada)';
    throw new Error(msg);
  }
  return await r.blob();
}

// Ajusta el tamaño de fuente y parte el texto en líneas para que quepa
function _vsFit(ctx, text, maxW, maxH){
  for (let size = 92; size >= 34; size -= 3){
    ctx.font = `800 ${size}px 'Inter','Segoe UI',system-ui,sans-serif`;
    const words = text.split(/\s+/); const lines = []; let line = '';
    for (const w of words){
      const test = line ? line+' '+w : w;
      if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    if (lines.length * size * 1.22 <= maxH) return { size, lines };
  }
  ctx.font = `800 34px 'Inter','Segoe UI',system-ui,sans-serif`;
  return { size:34, lines:[text] };
}

// Dibuja una tarjeta en el canvas (fondo de marca + texto + progreso)
function _vsDrawCard(ctx, W, H, card, i, total, alpha){
  // Fondo
  ctx.fillStyle = '#080A0F'; ctx.fillRect(0,0,W,H);
  // Glows de marca
  const g1 = ctx.createRadialGradient(W*0.25, H*0.18, 0, W*0.25, H*0.18, W*0.9);
  g1.addColorStop(0,'rgba(167,139,250,0.28)'); g1.addColorStop(1,'rgba(167,139,250,0)');
  ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);
  const g2 = ctx.createRadialGradient(W*0.8, H*0.85, 0, W*0.8, H*0.85, W*0.95);
  g2.addColorStop(0,'rgba(34,211,238,0.22)'); g2.addColorStop(1,'rgba(34,211,238,0)');
  ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = alpha;
  // Marca arriba
  ctx.textAlign = 'center';
  ctx.font = `800 34px 'Inter','Segoe UI',system-ui,sans-serif`;
  ctx.fillStyle = '#A78BFA';
  ctx.fillText('ORASIC', W/2 - 52, 150);
  ctx.fillStyle = '#22D3EE';
  ctx.fillText('LAB', W/2 + 66, 150);
  // Barra acento
  ctx.fillStyle = '#F472B6'; ctx.fillRect(W/2-40, 178, 80, 6);

  // Texto principal
  const pad = W*0.10;
  const fit = _vsFit(ctx, card, W - pad*2, H*0.55);
  ctx.font = `800 ${fit.size}px 'Inter','Segoe UI',system-ui,sans-serif`;
  ctx.fillStyle = '#F9FAFB';
  ctx.textBaseline = 'middle';
  const lh = fit.size * 1.22;
  let y = H/2 - (fit.lines.length-1)*lh/2;
  for (const ln of fit.lines){ ctx.fillText(ln, W/2, y); y += lh; }
  ctx.textBaseline = 'alphabetic';

  // Puntos de progreso
  const dotY = H - 130, gap = 34, startX = W/2 - (total-1)*gap/2;
  for (let d=0; d<total; d++){
    ctx.beginPath(); ctx.arc(startX + d*gap, dotY, d===i?9:6, 0, Math.PI*2);
    ctx.fillStyle = d===i ? '#F472B6' : 'rgba(255,255,255,0.25)'; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

    // 1) Si hay narración, primero pedimos el audio a ElevenLabs

    if (narrate){

        const chosenVoice = overlay.querySelector('#vs-voice')?.value || state.settings.elevenVoice;

      }
    }

    // 2) Duración: si hay voz, el video dura lo que dura la voz (+cola). Si no, tiempo fijo por tarjeta.
    const tail = 0.6;
    const durSec = audioBuf ? audioBuf.duration + tail : total * PER;
    // Reparte las tarjetas proporcionalmente a lo que la voz TARDA EN DECIRLAS, no al texto
    // que se ve: "→ +51 999 039 947" son 4 palabras en pantalla pero 14 habladas, y los ✅
    // no suenan. Medimos sobre el texto ya pronunciado y sin símbolos.
    const weights = cards.map(c => {
      const hablado = applyPronunciation(c)
        .replace(/[^\p{L}\p{N}\s]/gu, ' ')   // fuera emojis, flechas y signos
        .replace(/\s+/g, ' ').trim();
      return Math.max(8, hablado.length);     // los caracteres estiman mejor la duración que las palabras
    });
    const wSum = weights.reduce((a,b)=>a+b,0);
    const starts = []; let acc = 0;
    for (const w of weights){ starts.push(acc / wSum * (audioBuf ? audioBuf.duration : durSec)); acc += w; }
    const endOf = i => (i+1 < total ? starts[i+1] : (audioBuf ? audioBuf.duration : durSec));

    const mime = _vsPickMime(!!audioBuf);
    if (!mime){ status.textContent = 'Tu navegador no soporta grabación de video. Usa Chrome.'; genBtn.disabled = false; return; }
    const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';

    // 3) Armamos el stream: video del canvas + (opcional) pista de audio
    const stream = canvas.captureStream(30);
    let srcNode = null;
    if (audioBuf){
      const dest = audioCtx.createMediaStreamDestination();
      srcNode = audioCtx.createBufferSource();
      srcNode.buffer = audioBuf;

      // Normaliza el volumen: ElevenLabs entrega la voz bastante baja y, al
      // subirla a TikTok con música encima, quedaba enterrada. Llevamos el pico
      // a 0.89 (deja headroom para no saturar) y un compresor suave empareja
      // las sílabas fuertes con las débiles.
      let peak = 0;
      for (let c = 0; c < audioBuf.numberOfChannels; c++){
        const d = audioBuf.getChannelData(c);
        for (let i = 0; i < d.length; i += 16){ const v = Math.abs(d[i]); if (v > peak) peak = v; }
      }
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = peak > 0.001 ? Math.min(6, 0.89 / peak) : 1;
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25;

      srcNode.connect(gainNode); gainNode.connect(comp);
      comp.connect(dest);                 // al grabador
      comp.connect(audioCtx.destination); // y a los parlantes, para oírlo mientras se genera
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    }

    const chunks = [];
    let rec;
    try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 }); }
    catch(e){ status.textContent = 'Error iniciando la grabación: ' + e.message; genBtn.disabled = false; if(audioCtx)audioCtx.close(); return; }
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onerror = e => { status.innerHTML = `<span style="color:var(--red);">✕ Error de grabación: ${escHtml(String(e.error||e))}</span>`; };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      if (!blob.size){
        status.innerHTML = `<span style="color:var(--red);">✕ El video salió vacío.</span><br><span style="font-size:11.5px;">Mantén esta ventana visible durante la generación y vuelve a intentar.</span>`;
        genBtn.disabled = false; if (audioCtx) audioCtx.close(); return;
      }
      dl.href = URL.createObjectURL(blob);
      const today = new Date().toISOString().split('T')[0];
      const titleClean = (cards[0] || 'video').replace(/[^\w\s]/g, '').split(/\s+/).slice(0, 8).join('-').toLowerCase();
      dl.download = `${today}_${window._genTab}_${titleClean}.${ext}`;
      dl.style.display = '';
      status.innerHTML = `✅ Video listo — ${ext.toUpperCase()}, ${durSec.toFixed(1)}s, ${(blob.size/1048576).toFixed(1)} MB${audioBuf?' · <b style="color:var(--green);">con voz en off</b>':' · sin audio'}.<br>Descárgalo y súbelo a TikTok.`;
      bar.style.width = '100%';
      genBtn.disabled = false; genBtn.textContent = '↻ Generar otra vez';
      if (audioCtx) audioCtx.close();
    };

    // 4) Grabamos: dibujo por reloj (no se pausa al cambiar de pestaña) y parada garantizada
    const totalMs = durSec * 1000;
    const t0 = performance.now();
    rec.start(500); // timeslice: vuelca datos cada 500ms (evita que el archivo salga vacío)
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (srcNode) srcNode.start();
    status.textContent = audioBuf
      ? '🎬 Grabando con voz… deja esta ventana abierta.'
      : '🎬 Grabando… deja esta ventana abierta.';
    const drawTimer = setInterval(() => {
      const el = (performance.now() - t0) / 1000;
      let idx = 0;
      for (let i=0; i<total; i++){ if (el >= starts[i]) idx = i; }
      const segStart = starts[idx], segEnd = endOf(idx), segLen = Math.max(0.4, segEnd - segStart);
      const t = el - segStart;
      const fade = Math.min(0.35, segLen/4);
      let alpha = 1;
      // La PRIMERA tarjeta entra sin fundido: las estadísticas mostraron que la
      // gente abandona en el segundo 0:01, justo mientras el gancho aparecía.
      if (t < fade && idx > 0) alpha = t/fade;
      else if (t > segLen - fade) alpha = (segLen - t)/fade;
      _vsDrawCard(ctx, W, H, cards[idx], idx, total, Math.max(0, Math.min(1, alpha)));
      bar.style.width = Math.min(100, (el*1000/totalMs)*100) + '%';
    }, 1000/30);
    setTimeout(() => {
      clearInterval(drawTimer);
      _vsDrawCard(ctx, W, H, cards[total-1], total-1, total, 1);
      if (rec.state !== 'inactive') rec.stop();
      if (srcNode) { try { srcNode.stop(); } catch(_){} }
    }, totalMs + 300);
  };
}

function saveItem() {
  const get = id => document.getElementById(id)?.value||'';
  const status = get('inp-status') || 'ready';
  const date = get('inp-date') || '';
  const time = get('inp-time') || '';
  const assetFile = get('inp-asset') || '';
  const notes = get('inp-notes') || '';
  const s = wizardState;
  const id = s.editingId || uuid();

  const item = {
    id, seedDay: s.seedDay || null,
    topic: s.topic, rubro: s.rubro, goal: s.goal, pilar: s.pilar||'',
    platforms: s.platforms, tone: s.tone, keyMessage: s.keyMessage,
    audience: s.audience, cta: s.cta, hashtags: s.hashtags,
    generated: s.generated, status,
    scheduleDate: date, scheduleTime: time, assetFile, notes,
    createdAt: s.editingId ? (state.items.find(i=>i.id===id)?.createdAt||new Date().toISOString()) : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  if (s.editingId) {
    const idx = state.items.findIndex(i=>i.id===id);
    if (idx>-1) state.items[idx]=item; else state.items.push(item);
  } else {
    state.items.push(item);
  }
  saveState();
  showToast('✅ Pieza guardada en el banco','success');
  navigate('banco');
}

function markPublished(id) {
  const item = state.items.find(i=>i.id===id);
  if (!item) return;
  item.status = 'published';
  item.updatedAt = new Date().toISOString();
  saveState();
  showToast('✅ Marcada como publicada','success');
  render();
}

function editItem(id) {
  const item = state.items.find(i=>i.id===id);
  if (!item) return;
  const hasGenerated = item.generated && Object.keys(item.generated).length > 0;
  wizardState = {
    // start at step 2 (brief) if no generated content, step 3 if already generated
    step: hasGenerated ? 3 : 2,
    platforms: item.platforms||[], goal: item.goal||'',
    topic: item.topic||'', rubro: item.rubro||'', seedDay: item.seedDay||null,
    audience: item.audience||state.settings.audience, tone: item.tone||'Profesional y cercano',
    keyMessage: item.keyMessage||'', cta: item.cta||'', hashtags: item.hashtags||'',
    generated: item.generated||{}, scheduleDate: item.scheduleDate||'',
    scheduleTime: item.scheduleTime||'', assetFile: item.assetFile||'',
    notes: item.notes||'', editingId: id, generating: false,
    pilar: item.pilar||'', formato: item.formato||'',
    status: item.status||'ready'
  };
  navigate('crear', {editId: id});
}

function deleteItem(id) {
  if (!confirm('¿Eliminar esta pieza? No se puede deshacer.')) return;
  state.items = state.items.filter(i=>i.id!==id);
  saveState();
  showToast('🗑️ Pieza eliminada','info');
  render();
}

function openItem(id) {
  const item = state.items.find(i=>i.id===id);
  if (!item) return;
  const platforms = item.platforms||[];
  const gen = item.generated||{};
  document.getElementById('modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
      <div>
        <div style="font-size:18px;font-weight:700;margin-bottom:6px;">${escHtml(item.topic)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${platforms.map(p=>platformBadge(p)).join('')}
          ${statusBadge(item.status)}
          ${item.scheduleDate?`<span style="font-size:11px;color:var(--orange);margin-left:4px;">📅 ${fmtDate(item.scheduleDate)}</span>`:''}
        </div>
      </div>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    ${item.assetFile?`<div style="margin-bottom:16px;"><span class="asset-pill" style="font-size:12px;padding:4px 10px;">📎 ${escHtml(item.assetFile)}</span></div>`:''}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;font-size:12px;">
      <div style="background:var(--bg-card2);padding:10px;border-radius:8px;"><div style="color:var(--text-3);margin-bottom:3px;">Objetivo</div><div>${item.goal||'-'}</div></div>
      <div style="background:var(--bg-card2);padding:10px;border-radius:8px;"><div style="color:var(--text-3);margin-bottom:3px;">Rubro</div><div>${item.rubro||'-'}</div></div>
      <div style="background:var(--bg-card2);padding:10px;border-radius:8px;"><div style="color:var(--text-3);margin-bottom:3px;">Formato</div><div>${item.formato||item.tone||'-'}</div></div>
    </div>
    ${platforms.length>0&&Object.keys(gen).length>0?`
      <div class="gen-tabs" id="modal-tabs">
        ${platforms.map((p,i)=>`<div class="gen-tab ${i===0?'active':''}" onclick="modalSwitchTab('${p}')">${platformIcon(p)} ${p}</div>`).join('')}
      </div>
      ${platforms.map((p,i)=>`<div id="modal-panel-${p}" style="${i>0?'display:none':''}">${renderGenPanel(p,gen[p],item.id)}</div>`).join('')}
    `:`<div style="background:var(--bg-card2);padding:20px;border-radius:10px;text-align:center;color:var(--text-3);">Sin contenido generado. <button class="btn btn-primary btn-sm" style="margin-left:8px;" onclick="editItem('${item.id}');closeModal()">Generar ahora</button></div>`}
    <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="editItem('${item.id}');closeModal()">✎ Editar</button>
      ${item.status!=='published'?`<button class="btn btn-success" onclick="markPublished('${item.id}');closeModal()">✓ Marcar publicado</button>`:''}
      <button class="btn btn-danger" onclick="deleteItem('${item.id}');closeModal()">✕ Eliminar</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}

function modalSwitchTab(p){document.querySelectorAll('#modal-tabs .gen-tab').forEach(t=>t.classList.toggle('active',t.textContent.includes(p)));document.querySelectorAll('[id^="modal-panel-"]').forEach(el=>el.style.display='none');const panel=document.getElementById(`modal-panel-${p}`);if(panel)panel.style.display='';}
function closeModal(event){if(!event||event.target===document.getElementById('modal')){document.getElementById('modal').style.display='none';}}

function setBancoFilter(f){window._bancoFilter=f;render();}
function handleSearch(v){window._bancoSearch=v;render();}
function calPrev(){const d=window._calDate||new Date();window._calDate=new Date(d.getFullYear(),d.getMonth()-1,1);render();}
function calNext(){const d=window._calDate||new Date();window._calDate=new Date(d.getFullYear(),d.getMonth()+1,1);render();}
function calToday(){window._calDate=new Date();render();}

function saveConfig() {
  const get = id => document.getElementById(id)?.value||'';
  state.settings.brandName = get('cfg-name');
  state.settings.brandDesc = get('cfg-desc');
  state.settings.audience = get('cfg-audience');
  state.settings.phone = get('cfg-phone');
  state.settings.url = get('cfg-url');
  state.settings.claudeKey = get('cfg-claude');
  state.settings.elevenKey = get('cfg-eleven');
  // La voz por defecto se define con los radios (setDefaultVoice), no aquí.
  state.settings.higgsfieldKey = get('cfg-higgsfield');
  saveState();
  showToast('✅ Configuración guardada','success');
  render(); // refresh to show "Claude conectado" badge
}

function confirmClearAll() {
  if (confirm('¿Borrar TODO? No se puede deshacer.')) {
    state.items = [];
    saveState();
    showToast('🗑️ Todo eliminado','info');
    render();
  }
}

function attachEvents() {
  // already handled inline via onchange
}

// Nav clicks
document.querySelectorAll('.nav-item').forEach(el => {
  if (!el.dataset.page) return;   // enlaces externos (ej. Ayuda/Manual) usan su propio href, no el router
  el.addEventListener('click', () => navigate(el.dataset.page));

// Boot — Carga automática de guiones mejorados antes de inicializar
(async () => {
  // Cargar guiones mejorados (16-30) desde JSON
  try {
    const resp = await fetch('./guiones-mejorados.json');
    if (resp.ok) {
      const mejorados = await resp.json();
      Object.assign(GUIONES, mejorados);
      // Actualizar items existentes que usen estos guiones
      state.items.filter(i => i.seedDay && i.seedDay >= 16 && i.seedDay <= 30).forEach(item => {
        if (GUIONES[item.seedDay]) {
          item.guionCards = GUIONES[item.seedDay];
          item.updatedAt = new Date().toISOString();
        }
      });
      if (state.items.some(i => i.seedDay && i.seedDay >= 16 && i.seedDay <= 30)) saveState();
    }
  } catch (e) {
    // Silencioso si falla
  }
  // Inicializar la app después de cargar guiones
  updateBadges();
  render();
})();

// Sello de versión: muestra cuándo se guardó el archivo que estás viendo.
(function(){
  const el = document.getElementById('build-stamp');
  if (!el) return;
  const d = new Date(document.lastModified);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const esDeHoy = d >= hoy;
  el.innerHTML = `versión del ${d.toLocaleDateString('es',{day:'numeric',month:'short'})} ${d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`;
  el.style.color = esDeHoy ? 'var(--green)' : 'var(--orange)';
  el.title = esDeHoy ? 'Estás viendo la última versión' : 'Puede que el navegador tenga una versión vieja: recarga con Ctrl+Shift+R';
})();
</script>
