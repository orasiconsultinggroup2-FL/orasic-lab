<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sin caché: el servidor local (python http.server) no manda cabeceras de
       expiración y Chrome se quedaba con versiones viejas del archivo, obligando
       a inventar ?v=N en la URL cada vez. Con esto basta con recargar normal. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ORASIC Content Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/orasic-tour.js"></script>
  <script src="/tour-content-studio.js" defer></script>
  <script src="articulos-datos.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:    #080A0F;
      --bg-sidebar: #0C0E16;
      --bg-card:    #111827;
      --bg-card2:   #1a2236;
      --border:     #1F2937;
      --border2:    #2D3748;
      --text-1:     #F9FAFB;
      --text-2:     #9CA3AF;
      --text-3:     #6B7280;
      --violet:     #A78BFA;
      --violet-d:   #7C3AED;
      --cyan:       #22D3EE;
      --pink:       #F472B6;
      --orange:     #FB923C;
      --green:      #34D399;
      --red:        #F87171;
      --yellow:     #FCD34D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-base); color: var(--text-1); min-height: 100vh; display: flex; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-card); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet); }

    /* Sidebar */
    #sidebar { width: 240px; min-height: 100vh; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; }
    .nav-brand { padding: 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--violet), var(--cyan)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .brand-text { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; }
    .brand-text span { color: var(--violet); }
    .brand-sub { font-size: 10px; color: var(--text-3); margin-top: 1px; }
    nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .nav-section { margin-bottom: 16px; }
    .nav-section-label { font-size: 10px; font-weight: 600; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--text-2); transition: all 0.15s; text-decoration: none; white-space: nowrap; overflow: hidden; }
    .nav-item:hover { background: var(--bg-card); color: var(--text-1); }
    .nav-item.active { background: rgba(167,139,250,0.12); color: var(--violet); }
    .nav-item .icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .nav-item .label { flex: 1; }
    .nav-item .badge { background: var(--violet); color: white; font-size: 10px; font-weight: 700; border-radius: 99px; padding: 1px 6px; }

    /* Main */
    #main { margin-left: 240px; flex: 1; min-height: 100vh; }
    .page-header { padding: 24px 32px 0; border-bottom: 1px solid var(--border); background: var(--bg-base); position: sticky; top: 0; z-index: 10; }
    .page-header-inner { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
    .page-body { padding: 28px 32px; }

    /* Cards */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card-title { font-size: 11px; font-weight: 600; color: var(--text-2); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Alert banner */
    .alert-banner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; }
    .alert-banner.red { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); }
    .alert-banner.orange { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.25); }
    .alert-banner .ab-icon { font-size: 20px; }
    .alert-banner .ab-text { flex: 1; font-size: 13.5px; }
    .alert-banner .ab-text strong { font-weight: 700; }

    /* Stats */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.violet::before { background: var(--violet); }
    .stat-card.cyan::before { background: var(--cyan); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.orange::before { background: var(--orange); }
    .stat-num { font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .stat-label { font-size: 12px; color: var(--text-2); }
    .stat-icon { position: absolute; top: 16px; right: 16px; font-size: 20px; opacity: 0.3; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: var(--violet); color: white; }
    .btn-primary:hover { background: #9370f0; }
    .btn-secondary { background: var(--bg-card2); color: var(--text-1); border: 1px solid var(--border2); }
    .btn-secondary:hover { border-color: var(--violet); color: var(--violet); }
    .btn-ghost { background: transparent; color: var(--text-2); padding: 8px 12px; }
    .btn-ghost:hover { color: var(--text-1); }
    .btn-danger { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
    .btn-danger:hover { background: rgba(248,113,113,0.2); }
    .btn-success { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
    .btn-success:hover { background: rgba(52,211,153,0.2); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-icon { padding: 8px; border-radius: 8px; background: var(--bg-card2); border: 1px solid var(--border); cursor: pointer; color: var(--text-2); font-size: 14px; transition: all 0.15s; }
    .btn-icon:hover { border-color: var(--violet); color: var(--violet); }
    .btn-warning { background: rgba(251,191,36,0.1); color: #FCD34D; border: 1px solid rgba(251,191,36,0.3); }
    .btn-warning:hover { background: rgba(251,191,36,0.2); }

    /* Platform badges */
    .platform-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .pb-tiktok { background: rgba(255,0,80,0.15); color: #FF6090; border: 1px solid rgba(255,0,80,0.2); }
    .pb-instagram { background: rgba(244,114,182,0.12); color: var(--pink); border: 1px solid rgba(244,114,182,0.2); }
    .pb-linkedin { background: rgba(10,102,194,0.15); color: #60A5FA; border: 1px solid rgba(10,102,194,0.2); }
    .pb-blog { background: rgba(34,211,238,0.12); color: var(--cyan); border: 1px solid rgba(34,211,238,0.2); }
    .pb-facebook { background: rgba(24,119,242,0.12); color: #60A5FA; border: 1px solid rgba(24,119,242,0.2); }

    /* Status badges */
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .sb-draft { background: rgba(107,114,128,0.15); color: var(--text-2); }
    .sb-ready { background: rgba(167,139,250,0.15); color: var(--violet); }
    .sb-scheduled { background: rgba(251,146,60,0.12); color: var(--orange); }
    .sb-published { background: rgba(52,211,153,0.12); color: var(--green); }

    /* Wizard */
    .wizard-steps { display: flex; align-items: center; gap: 0; margin-bottom: 32px; }
    .wizard-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
    .wizard-step:not(:last-child)::after { content: ''; position: absolute; top: 16px; left: 50%; width: 100%; height: 1px; background: var(--border); }
    .wizard-step.done::after { background: var(--violet); }
    .step-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card2); border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; position: relative; z-index: 1; }
    .wizard-step.active .step-circle { background: var(--violet); border-color: var(--violet); color: white; }
    .wizard-step.done .step-circle { background: var(--violet); border-color: var(--violet); color: white; }
    .step-label { font-size: 11px; color: var(--text-3); margin-top: 6px; text-align: center; }
    .wizard-step.active .step-label, .wizard-step.done .step-label { color: var(--violet); }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .form-input, .form-textarea, .form-select { width: 100%; background: var(--bg-card2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text-1); padding: 10px 14px; font-size: 14px; font-family: inherit; transition: border 0.15s; outline: none; }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--violet); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }

    /* Platform/goal selectors */
    .platform-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    .platform-chip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 2px solid var(--border2); background: var(--bg-card2); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-2); transition: all 0.15s; user-select: none; }
    .platform-chip:hover { border-color: var(--violet); color: var(--text-1); }
    .platform-chip.selected { border-color: var(--violet); background: rgba(167,139,250,0.1); color: var(--violet); }
    .platform-chip .picon { font-size: 18px; }

    .goal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .goal-card { padding: 16px; border-radius: 10px; border: 2px solid var(--border2); background: var(--bg-card2); cursor: pointer; text-align: center; transition: all 0.15s; }
    .goal-card:hover { border-color: var(--violet); }
    .goal-card.selected { border-color: var(--violet); background: rgba(167,139,250,0.1); }
    .goal-icon { font-size: 24px; margin-bottom: 8px; }
    .goal-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .goal-desc { font-size: 11px; color: var(--text-2); }

    .tone-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .tone-chip { padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--border2); background: var(--bg-card2); cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-2); transition: all 0.15s; }
    .tone-chip:hover { border-color: var(--cyan); color: var(--cyan); }
    .tone-chip.selected { border-color: var(--cyan); background: rgba(34,211,238,0.1); color: var(--cyan); }

    /* Generated content */
    .gen-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .gen-tab { padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .gen-tab:hover { color: var(--text-1); }
    .gen-tab.active { color: var(--violet); border-bottom-color: var(--violet); }
    .gen-content-block { background: var(--bg-card2); border: 1px solid var(--border2); border-radius: 10px; padding: 16px; font-size: 13.5px; line-height: 1.7; color: var(--text-1); white-space: pre-wrap; font-family: inherit; position: relative; }
    .gen-copy-btn { position: absolute; top: 10px; right: 10px; padding: 5px 10px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border2); color: var(--text-2); font-size: 11px; cursor: pointer; transition: all 0.15s; }
    .gen-copy-btn:hover { border-color: var(--violet); color: var(--violet); }
    .gen-copy-clean { right: 96px; border-color: var(--violet); color: var(--violet); background: rgba(167,139,250,0.12); }
    .gen-copy-clean:hover { background: var(--violet); color: #0a0a0f; }
    .gen-actionbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn-copyall { flex: 1; min-width: 200px; padding: 11px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 13.5px; font-weight: 700; color: #0a0a0f; background: linear-gradient(135deg, var(--violet), var(--cyan)); transition: opacity 0.15s; }
    .btn-copyall:hover { opacity: 0.9; }
    .btn-gonet { padding: 11px 16px; border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--cyan); background: var(--bg-card2); border: 1px solid var(--cyan); transition: all 0.15s; }
    .btn-gonet:hover { background: var(--cyan); color: #0a0a0f; }
    .btn-video { padding: 11px 16px; border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--pink); background: var(--bg-card2); border: 1px solid var(--pink); transition: all 0.15s; }
    .btn-video:hover { background: var(--pink); color: #0a0a0f; }
    /* Video Studio overlay */
    .vs-overlay { position: fixed; inset: 0; background: rgba(4,6,11,0.88); backdrop-filter: blur(6px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .vs-modal { background: var(--bg-card); border: 1px solid var(--border2); border-radius: 16px; padding: 22px; width: min(760px, 96vw); max-height: 94vh; overflow-y: auto; }
    .vs-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .vs-title { font-size: 17px; font-weight: 800; }
    .vs-sub { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }
    .vs-body { display: flex; gap: 20px; flex-wrap: wrap; }
    .vs-stage { flex: 0 0 auto; margin: 0 auto; }
    .vs-canvas { width: 240px; aspect-ratio: 9/16; border-radius: 12px; border: 1px solid var(--border2); background: #080A0F; display: block; }
    .vs-side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 12px; }
    .vs-cards-label { font-size: 10px; font-weight: 700; color: var(--violet); letter-spacing: 0.08em; text-transform: uppercase; }
    .vs-cards { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 200px; overflow-y: auto; font-size: 12px; color: var(--text-2); line-height: 1.5; }
    .vs-cards .vc { padding: 5px 0; border-bottom: 1px solid var(--border); }
    .vs-cards .vc:last-child { border-bottom: none; }
    .vs-cards .vc b { color: var(--pink); }
    .vs-status { font-size: 12.5px; color: var(--text-2); min-height: 18px; }
    .vs-progress { height: 6px; background: var(--bg-card2); border-radius: 99px; overflow: hidden; }
    .vs-progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--pink)); transition: width 0.1s; }
    .vs-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .vs-narr { display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px; border-radius: 10px; background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.28); font-size: 12.5px; cursor: pointer; }
    .vs-narr.off { background: var(--bg-card2); border-color: var(--border); opacity: 0.75; cursor: default; }
    .vs-narr input { margin-top: 2px; accent-color: var(--violet); cursor: inherit; }
    .vs-narr-hint { display: block; font-size: 11.5px; color: var(--text-2); margin-top: 2px; font-weight: 400; }
    /* Lista de voces en Configuración */
    .voice-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px; background: var(--bg-card2); border: 1px solid var(--border); margin-bottom: 6px; }
    .voice-row.is-default { border-color: rgba(167,139,250,0.45); background: rgba(167,139,250,0.07); }
    .voice-row input[type=radio] { accent-color: var(--violet); cursor: pointer; flex-shrink: 0; }
    .voice-info { flex: 1; min-width: 0; }
    .voice-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
    .voice-id { font-size: 10.5px; color: var(--text-3); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .voice-tag { font-size: 9.5px; font-weight: 700; color: var(--violet); background: rgba(167,139,250,0.15); padding: 1px 7px; border-radius: 99px; margin-left: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    /* Rendimiento */
    .perf-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px; border-radius: 10px; background: var(--bg-card2); border: 1px solid var(--border); border-left: 3px solid var(--border2); margin-bottom: 9px; }
    .perf-row.sev-alta { border-left-color: var(--red); }
    .perf-row.sev-media { border-left-color: var(--orange); }
    .perf-row.sev-ok { border-left-color: var(--green); }
    .perf-main { flex: 1; min-width: 0; }
    .perf-title { font-size: 13.5px; font-weight: 600; color: var(--text-1); line-height: 1.4; }
    .perf-meta { font-size: 11px; color: var(--text-3); margin-top: 3px; }
    .perf-nums { display: flex; gap: 13px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .perf-diag { margin-top: 9px; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
    .perf-diag b { color: var(--text-1); }
    .perf-tag { display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 99px; margin-right: 7px; vertical-align: 1px; }
    .perf-tag.sev-alta { background: rgba(248,113,113,.16); color: var(--red); }
    .perf-tag.sev-media { background: rgba(251,146,60,.16); color: var(--orange); }
    .perf-tag.sev-ok { background: rgba(74,222,128,.16); color: var(--green); }
    .strat-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px solid var(--border); }
    .strat-row:last-child { border-bottom: none; }
    .strat-note { font-size: 12.5px; color: var(--text-2); line-height: 1.6; padding: 7px 0 7px 13px; border-left: 2px solid var(--violet); margin-bottom: 7px; }
    .strat-note b { color: var(--text-1); }
    .perf-net { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); }
    .perf-net:first-of-type { border-top: none; }
    .perf-netname { font-weight: 700; color: var(--text-1); min-width: 92px; }
    .perf-falta { margin-top: 8px; font-size: 11.5px; color: var(--text-3); font-style: italic; }
    .net-card { flex: 1; min-width: 175px; background: var(--bg-card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .net-name { font-size: 13px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; }
    .net-stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--text-2); padding: 3px 0; }
    .net-stat b { color: var(--cyan); font-variant-numeric: tabular-nums; }
    /* LinkedIn */
    .li-article-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .li-article-row:last-child { border-bottom: none; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .photo-card { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .photo-card img { width: 100%; height: 130px; object-fit: cover; display: block; background: var(--bg-card); }
    .photo-card-body { padding: 10px; }
    .undo-bar { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 1200; display: flex; align-items: center; gap: 14px; background: var(--bg-card); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 16px; font-size: 13px; color: var(--text-1); box-shadow: 0 8px 28px rgba(0,0,0,.45); }
    .undo-bar button { background: none; border: none; color: var(--violet); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0; }
    .undo-bar button:hover { text-decoration: underline; }
    .gen-section-label { font-size: 10px; font-weight: 700; color: var(--violet); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
    .gen-section-label:first-child { margin-top: 0; }

    /* AI loading */
    .gen-loading { text-align: center; padding: 48px 20px; color: var(--text-3); }
    .gen-spinner { width: 40px; height: 40px; border: 3px solid var(--border2); border-top-color: var(--violet); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }

    /* Content bank */

    @media (max-width: 768px) {

const STORAGE_KEY = 'orasic_studio_v2';

// Valores por defecto de ajustes que se agregaron en versiones nuevas.
// Se rellenan en estados ya guardados para no perder funciones al actualizar.
const SETTINGS_DEFAULTS = {
  elevenKey: '',
  elevenVoice: '',
  elevenVoices: [],
  pronunciations: 'ORASIC Lab = Orásic Lab\nORASIC = Orásic\nWhatsApp = Guatsáp\nsoftware = sóftwer\nmarketing = márketin'
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const st = JSON.parse(raw);
      st.settings = st.settings || {};
      for (const k in SETTINGS_DEFAULTS){
        if (st.settings[k] === undefined) st.settings[k] = SETTINGS_DEFAULTS[k];
      }
      st.linkedinArticles = st.linkedinArticles || [];
      st.blogArticles = st.blogArticles || [];
      st.photoBank = st.photoBank || [];

      // Migración: añadir sugerencia_imagen a artículos existentes que no la tengan
      (st.linkedinArticles || []).forEach(a => {
        if (a.sugerencia_imagen === undefined) a.sugerencia_imagen = '';
      });
      (st.blogArticles || []).forEach(a => {
        if (a.sugerencia_imagen === undefined) a.sugerencia_imagen = '';
      });

      return st;
    }
  } catch(e) {}
  return {
    items: [],
    linkedinArticles: [],
    blogArticles: [],
    photoBank: [],
    settings: {
      brandName: 'ORASIC Lab',
      brandDesc: 'Agencia de desarrollo de software y apps a medida con IA para negocios en Perú y Colombia.',
      audience: 'Dueños de negocios pyme en Perú y Colombia (salud, belleza, retail, deporte)',
      phone: '+51 999 039 947',
      url: 'orasic-lab.vercel.app',
      claudeKey: '',
      elevenKey: '',
      elevenVoice: '',
      elevenVoices: [],
      // Cómo debe PRONUNCIAR la voz ciertas palabras (no cambia el texto en pantalla)
      pronunciations: 'ORASIC Lab = Orásic Lab\nORASIC = Orásic\nWhatsApp = Guatsáp\nsoftware = sóftwer\nmarketing = márketin',
      higgsfieldKey: '',
      voices: ['Giancarlos - Latin American Narrator', 'Jorge - Warm, Close and Friendly', 'Diego Cárdenas - Soothing and Meditative']
    }
  };
}

function syncArticlesFromJSON() {
  if (typeof ARTICULOS_DATA !== 'undefined' && ARTICULOS_DATA) {
    state.linkedinArticles = ARTICULOS_DATA.linkedinArticles || [];
    state.blogArticles = ARTICULOS_DATA.blogArticles || [];
    saveState();
    render();
    console.log('✅ Artículos sincronizados desde ARTICULOS_DATA');
  } else {
    fetch('./articulos-datos.js')
      .then(r => r.text())
      .then(text => {
        eval(text);
        if (typeof ARTICULOS_DATA !== 'undefined') {
          state.linkedinArticles = ARTICULOS_DATA.linkedinArticles || [];
          state.blogArticles = ARTICULOS_DATA.blogArticles || [];
          saveState();
          render();
        }
      })
      .catch(e => console.warn('No se pudo cargar articulos-datos.js:', e));
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateBadges();
}

let currentPhotoFieldId = null;

function openFotosFolder(fieldId) {
  currentPhotoFieldId = fieldId;
  const fileInput = document.getElementById('fotoFileInput');
  if (fileInput) fileInput.click();
}

function handleFotoSelected(event) {
  const file = event.target.files[0];
  if (!file || !currentPhotoFieldId) return;

  const fileName = file.name;
  const photoField = document.getElementById(currentPhotoFieldId);

  if (photoField) {
    photoField.value = fileName;
  }

  // Resetear para próxima vez
  event.target.value = '';
}

  const ov = document.createElement('div');
  ov.className = 'vs-overlay';
  const photoHtml = photoFile ? `<div style="margin:20px 0;padding:20px;background:var(--bg-card2);border-radius:8px;border:1px solid var(--border);text-align:center;color:var(--text-2);font-size:12px;">📷 ${photoFile}</div>` : '';

  ov.onclick = e => { if (e.target === ov) ov.remove(); };

function publishBlogArticle() {
  const lastEdited = sessionStorage.getItem('lastEditedBlogId');
  if (!lastEdited) { alert('No hay artículo para publicar'); return; }

  const article = state.blogArticles.find(a => a.id === lastEdited);
  if (!article) { alert('No se encontró el artículo'); return; }

  // Marcar como published localmente
  article.status = 'published';
  article.publishedAt = new Date().toISOString();
  saveState();

  // Enviar al servidor para actualizar articulos.json
  fetch('/api/publish-blog', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(article)
  })
  .then(r => r.json())
  .then(data => {
    if (data.success || data.article) {
      showToast('✅ Artículo publicado en Blog', 'success');
      setTimeout(() => {
        window.location.href = 'https://orasic-lab.vercel.app/blog.html';
      }, 1500);
    } else {
      throw new Error(data.error || 'Error desconocido');
    }
  })
  .catch(err => {
    console.error('Error al publicar:', err);
    showToast('❌ Error: ' + err.message, 'error');
  });
}

function copyForLinkedIn(title, body, hashtags, photoFile) {
  // Construir el contenido para copiar
  let content = `${toBoldUnicode(title)}\n\n${body}\n\n${hashtags}`.trim();

  if (photoFile) {
    content += `\n\n---\n📷 Foto: fotos-articulos/${photoFile}\n\n💡 Paso: En LinkedIn, clic en "📷 Agregar imagen" → navega a fotos-articulos/ → selecciona ${photoFile}`;
  }

  // Copiar al portapapeles
  navigator.clipboard.writeText(content).then(() => {
    if (typeof showToast === 'function') {
      showToast(photoFile ? '✓ Copiado + instrucciones de foto' : '✓ Copiado para LinkedIn', 'success');
    }
  }).catch(err => {
    alert('Error al copiar: ' + err);
  });
}

const SEED_START = new Date(2026, 6, 28); // July 28 in local time — primer video publicado

function reimportCalendarSeed() {
  if (!confirm('¿Actualizar las 30 piezas del calendario con los textos más recientes?\n\nSe conservan tu estado de publicación, los guiones ya generados y los números de rendimiento.')) return;
  // Antes esto borraba y recreaba todo, y con ello se perdía lo que ya habías
  // avanzado. Ahora refresca el texto del seed y preserva tu trabajo.
  const prev = new Map(state.items.filter(i => i.seedDay).map(i => [i.seedDay, i]));
  state.items = state.items.filter(i => !i.seedDay);
  importCalendarSeed();
  let refrescadas = 0;
  state.items.forEach(i => {
    const p = prev.get(i.seedDay);
    if (!p) return;
    refrescadas++;
    // Lo tuyo se mantiene; lo que viene del seed (tema, mensaje, rubro) se actualiza.
    if (p.status && p.status !== 'ready') i.status = p.status;
    if (p.metrics) i.metrics = p.metrics;
    if (p.assetFile) i.assetFile = p.assetFile;
    if (p.generated && Object.keys(p.generated).length) i.generated = p.generated;
    if (p.publishedAt) i.publishedAt = p.publishedAt;
  });
  saveState(); render();
  if (typeof toast === 'function') toast(`${refrescadas} piezas actualizadas`);
}

function importCalendarSeed() {
  const existing = new Set(state.items.map(i => i.seedDay));
  let added = 0;

  CALENDAR_SEED.forEach(row => {
    if (existing.has(row.day)) return;
    const date = new Date(SEED_START);
    date.setDate(date.getDate() + row.day - 1);
    const dateStr = fmtDateISO(date);

    const pillarGoalMap = {
      'Mito vs Realidad': 'educacion',
      'Antes/Después': 'portafolio',
      'Números': 'awareness',
      'Tips': 'educacion',
      'Rubro del día': 'portafolio',
      'Detrás de cámara': 'comunidad',
      'Objeciones': 'educacion'
    };

    state.items.push({
      id: uuid(),
      seedDay: row.day,
      topic: row.idea,
      rubro: row.rubro,
      goal: row.goal || pillarGoalMap[row.pilar] || 'awareness',
      pilar: row.pilar,
      formato: row.formato,
      platforms: ['TikTok', 'Instagram'],
      tone: row.formato === 'Narrado' ? 'Profesional y cercano' : 'Directo y urgente',
      keyMessage: row.mensaje || '',
      guionCards: GUIONES[row.day] || null,   // guion escrito a mano, si existe
      audience: state.settings.audience,
      cta: 'Escríbenos al WhatsApp y cuéntanos tu idea',
      hashtags: '#ORASICLab #AppsAMedida #PymesPeru #TransformacionDigital',
      generated: {},
      status: row.status || 'ready',
      scheduleDate: dateStr,
      scheduleTime: '09:00',
      assetFile: row.asset || '',
      notes: `Día ${row.day} del calendario. Pilar: ${row.pilar}.`,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
    added++;
  });

  saveState();
  showToast(`✅ ${added} piezas importadas al banco`, 'success');
  render();
}

function guardarVideoPerenne() {
  const titulo = document.getElementById('bv-titulo').value.trim();
  const rubro = document.getElementById('bv-rubro').value.trim();
  const duracion = parseInt(document.getElementById('bv-duracion').value) || 0;
  const resolucion = document.getElementById('bv-resolucion').value.trim();
  const naracion = document.getElementById('bv-naracion').checked;
  const url = document.getElementById('bv-url').value.trim();

  if (!titulo || !duracion || !resolucion || !url) {
    alert('Completa todos los campos requeridos');
    return;

  const video = {
    id: uuid(),
    titulo, rubro, duracion, resolucion, naracion, url,
    createdAt: new Date().toISOString(),

  };

  state.biblioteca.push(video);
  saveState();
  updateBadges();
  render();
  document.querySelector('.modal-overlay').remove();

function confirmarProgramacionVideo(videoId) {
  const video = state.biblioteca.find(v => v.id === videoId);
  const fecha = document.getElementById('pv-fecha').value;
  const hora = document.getElementById('pv-hora').value || '09:00';
  const plataformas = [
    document.getElementById('pv-tiktok').checked ? 'TikTok' : null,
    document.getElementById('pv-instagram').checked ? 'Instagram' : null,
    document.getElementById('pv-youtube').checked ? 'YouTube' : null
  ].filter(p => p);

  if (!fecha || plataformas.length === 0) {
    alert('Selecciona fecha, hora y al menos una plataforma');
    return;
  }

  video.publicaciones.push({
    fecha, hora, plataformas, publishedAt: new Date().toISOString()
  });

  saveState();
  render();
  document.querySelector('.modal-overlay').remove();
  showToast('✓ Video programado para ' + hora + ' — ' + plataformas.join(', '), 'success');
}

function irAPublicar(plataforma, titulo) {
  let url = '';
  const caption = titulo + ' — ORASICLab\n\n+51 999 039 947\norasic-lab.vercel.app';

  if (plataforma === 'tiktok') {
    url = 'https://www.tiktok.com/upload';
  } else if (plataforma === 'instagram') {
    url = 'https://www.instagram.com/';
  } else if (plataforma === 'youtube') {
    url = 'https://www.youtube.com/upload';
  }

  if (url) {
    try {
      navigator.clipboard.writeText(caption);
      showToast('✓ Caption copiado al portapapeles', 'success');
    } catch(e) {
      console.log('Caption:', caption);
    }
    window.open(url, '_blank');
  }
}

  state.biblioteca = state.biblioteca.filter(v => v.id !== videoId);

let currentPage = 'dashboard';

function resetWizard() {
  return { step: 1, platforms: [], goal: '', topic: '', rubro: '', audience: '', tone: 'Profesional y cercano', keyMessage: '', cta: '', hashtags: '', generated: {}, scheduleDate: '', scheduleTime: '', assetFile: '', notes: '', editingId: null, generating: false };
}

function navigate(page, params = {}) {
  currentPage = page;
  if (page === 'crear' && !params.editId) wizardState = resetWizard();
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  render();
  // Al entrar al Banco, salta directo a la pieza de hoy en vez de dejarte
  // scrolleando desde el día 1. Solo al navegar, no en cada filtro/búsqueda.
  if (page === 'banco') {
    setTimeout(() => {
      const row = document.getElementById('banco-today-row');
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
  }
}

function render() {
  const el = document.getElementById('page-content');
  const pages = { dashboard: renderDashboard, crear: renderCrear, banco: renderBanco, biblioteca: renderBiblioteca, calendario: renderCalendario, guiones: renderGuiones, rendimiento: renderRendimiento, linkedin: renderLinkedIn, blog: renderBlogPage, estrategia: renderEstrategia, config: renderConfig };
  el.innerHTML = (pages[currentPage] || renderDashboard)();
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
  attachEvents();
}

function renderPlatformStats() {
  const platforms = ['TikTok','Instagram','Blog','LinkedIn','Facebook'];
  const counts = {};
  platforms.forEach(p => counts[p] = 0);
  state.items.forEach(item => { (item.platforms||[]).forEach(p => { if(counts[p]!==undefined) counts[p]++; }); });
  const max = Math.max(...Object.values(counts), 1);
  return platforms.map(p => `
    <div style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:3px;">
        <span style="font-size:12px; color:var(--text-2);">${platformIcon(p)} ${p}</span>
        <span style="font-size:12px; font-weight:600;">${counts[p]}</span>
      </div>
      <div style="height:4px; background:var(--border2); border-radius:99px; overflow:hidden;">
        <div style="height:100%; width:${(counts[p]/max*100)}%; background:var(--violet); border-radius:99px;"></div>
      </div>
    </div>
  `).join('');
}

const NET_CONFIG = {
  TikTok:    { url:'https://www.tiktok.com/upload?lang=es', label:'Ir a TikTok',    paste:['caption','hashtags'], video:true },
  Instagram: { url:'https://www.instagram.com/',           label:'Ir a Instagram', paste:['caption','hashtags'], video:true },
  Facebook:  { url:'https://www.facebook.com/',            label:'Ir a Facebook',  paste:['caption','hashtags'], video:true },
  LinkedIn:  { url:'https://www.linkedin.com/feed/?shareActive=true', label:'Ir a LinkedIn', paste:['post','hashtags'] },
  Blog:      { url:'',                                     label:'',               paste:['title','intro','body'] }
};

function renderGenPanel(platform, gen, itemId) {
  if (!gen) return '<div style="color:var(--text-3);padding:20px;text-align:center;">Sin contenido generado</div>';
  const blocks = [];
  if (platform === 'TikTok' || platform === 'Facebook') {
    if (gen.script) blocks.push({label:'GUIÓN / SCRIPT', content: gen.script, type:'script', isScript:true});
    if (gen.caption) blocks.push({label:'CAPTION', content: gen.caption, type:'caption'});
    if (gen.hashtags) blocks.push({label:'HASHTAGS', content: gen.hashtags, type:'hashtags'});
    if (gen.imagePrompt) blocks.push({label:'PROMPT DE IMAGEN (Higgsfield)', content: gen.imagePrompt, type:'imagePrompt'});
  }
  if (platform === 'Instagram') {
    if (gen.script) blocks.push({label:'GUIÓN DE CARRUSEL (5 slides)', content: gen.script, type:'script', isScript:true});
    if (gen.caption) blocks.push({label:'CAPTION', content: gen.caption, type:'caption'});
    if (gen.hashtags) blocks.push({label:'HASHTAGS', content: gen.hashtags, type:'hashtags'});
    if (gen.imagePrompt) blocks.push({label:'PROMPT DE IMAGEN (Higgsfield)', content: gen.imagePrompt, type:'imagePrompt'});
  }
  if (platform === 'Blog') {
    if (gen.title) blocks.push({label:'TÍTULO SEO', content: gen.title, type:'title'});
    if (gen.intro) blocks.push({label:'INTRODUCCIÓN', content: gen.intro, type:'intro'});
    if (gen.body) blocks.push({label:'CUERPO DEL ARTÍCULO', content: gen.body, type:'body'});
    if (gen.seoDesc) blocks.push({label:'META DESCRIPCIÓN (SEO)', content: gen.seoDesc, type:'seoDesc'});
  }
  if (platform === 'LinkedIn') {
    if (gen.post) blocks.push({label:'POST', content: gen.post, type:'post'});
    if (gen.hashtags) blocks.push({label:'HASHTAGS', content: gen.hashtags, type:'hashtags'});
  }
  const net = NET_CONFIG[platform] || {paste:[]};
  const actionBar = `
    <div class="gen-actionbar">
      <button class="btn-copyall" data-paste="${net.paste.join(',')}" onclick="copyAll(this)">📋 Copiar todo para publicar</button>
      ${net.video ? `<button class="btn-video" onclick="openVideoStudio(this)">🎬 Generar video</button>` : ''}
      ${net.url ? `<button class="btn-gonet" onclick="irARed('${net.url}','${itemId||''}')">↗ ${net.label}</button>` : ''}
    </div>`;
  return `<div class="gen-panel-inner">` + actionBar + blocks.map(b => `
    <div class="gen-section-label">${b.label}</div>
    <div class="gen-content-block" data-type="${b.type||''}" contenteditable="true">
      <button class="gen-copy-btn" onclick="copyBlock(this)">📋 Copiar</button>${b.isScript ? `<button class="gen-copy-btn gen-copy-clean" onclick="copyClean(this)">✨ Copiar limpio</button>` : ''}${escHtml(b.content)}
    </div>
  `).join('') + `</div>`;
}

function renderBanco() {
  const allItems = [...state.items].sort((a,b) => {
    if (a.scheduleDate && b.scheduleDate) return a.scheduleDate.localeCompare(b.scheduleDate);
    if (a.scheduleDate) return -1;
    if (b.scheduleDate) return 1;
    return new Date(b.createdAt)-new Date(a.createdAt);
  });
  const filter = window._bancoFilter || 'all';
  const search = window._bancoSearch || '';

  const filtered = allItems.filter(item => {
    const matchFilter = filter === 'all' || item.status === filter || (item.platforms||[]).includes(filter);
    const matchSearch = !search || item.topic.toLowerCase().includes(search.toLowerCase()) || (item.rubro||'').toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const todayISO = fmtDateISO(new Date());

  return `
    <div class="page-header">
      <div class="page-header-inner">
        <div>
          <div class="page-title">Banco de Contenido</div>

      <div class="filter-bar">
        <input class="form-input" id="search-input" style="max-width:280px;padding:7px 12px;font-size:13px;" placeholder="🔍 Buscar tema o rubro..." value="${escAttr(search)}" oninput="handleSearch(this.value)" />
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${['all','draft','ready','scheduled','published','TikTok','Instagram','Blog','LinkedIn'].map(f=>`<span class="filter-chip ${filter===f?'active':''}" onclick="setBancoFilter('${f}')">${filterLabel(f)}</span>`).join('')}

      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        ${filtered.length === 0 ? `
          <div style="text-align:center;padding:48px 20px;color:var(--text-3);">
            ${state.items.length === 0 ? `
              <div style="font-size:36px;margin-bottom:12px;">✦</div>

            ` : '<div>No hay resultados para ese filtro.</div>'}

        ` : filtered.map(item => {
          const isToday = item.scheduleDate && item.scheduleDate.split('T')[0] === todayISO;
          return `

function renderCalendario() {
  const now = window._calDate || new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const monthName = new Intl.DateTimeFormat('es-PE',{month:'long',year:'numeric'}).format(now);

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startDow = (firstDay.getDay()+6)%7;
  const today = new Date();
  const todayISO = fmtDateISO(today);

  // FIX #5: include all statuses that have a scheduleDate
  const itemsByDate = {};
  state.items.forEach(item => {
    if (!item.scheduleDate) return;
    const d = item.scheduleDate.split('T')[0];
    if (!itemsByDate[d]) itemsByDate[d] = [];
    itemsByDate[d].push(item);
  });

  const days = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const cells = [];
  for (let i=0; i<startDow; i++) cells.push({date:new Date(year,month,1-startDow+i),other:true});
  for (let d=1; d<=lastDay.getDate(); d++) cells.push({date:new Date(year,month,d),other:false});
  while (cells.length%7!==0) cells.push({date:new Date(year,month+1,cells.length-lastDay.getDate()-startDow+1),other:true});

  // Summary for this month
  const monthItems = state.items.filter(i => i.scheduleDate && i.scheduleDate.startsWith(`${year}-${String(month+1).padStart(2,'0')}`));
  const monthPub = monthItems.filter(i=>i.status==='published').length;
  const monthPend = monthItems.filter(i=>i.status!=='published').length;

  return `
    <div class="page-header">
      <div class="page-header-inner">
        <div>
          <div class="page-title">Calendario Editorial</div>
          <div class="page-sub" style="text-transform:capitalize;">${monthName} · ${monthPub} publicadas · ${monthPend} pendientes</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" onclick="calPrev()">← Anterior</button>
          <button class="btn btn-secondary" onclick="calToday()">Hoy</button>
          <button class="btn btn-secondary" onclick="calNext()">Siguiente →</button>
          <button class="btn btn-primary" onclick="navigate('crear')">✦ Nueva</button>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div style="display:flex;gap:16px;margin-bottom:16px;font-size:12px;">
        <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:rgba(52,211,153,0.3);display:inline-block;"></span> Publicado</span>
        <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:rgba(167,139,250,0.3);display:inline-block;"></span> Listo</span>
        <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:rgba(251,146,60,0.3);display:inline-block;"></span> Programado</span>
        <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:rgba(107,114,128,0.2);display:inline-block;"></span> Borrador</span>
      </div>
      <div class="cal-grid">
        ${days.map(d=>`<div class="cal-header">${d}</div>`).join('')}
        ${cells.map(cell => {
          const key = fmtDateISO(cell.date);
          const items = itemsByDate[key]||[];
          const isToday = key===todayISO;
          const hasTodayAlert = isToday && items.some(i=>i.status==='ready'||i.status==='scheduled');
          return `
            <div class="cal-day ${cell.other?'other-month':''} ${isToday?'today':''}" style="${hasTodayAlert?'box-shadow:inset 0 0 0 2px var(--red);':''}">
              <div class="cal-day-num">${cell.date.getDate()}${hasTodayAlert?'<span style="color:var(--red);font-size:9px;"> 🔴</span>':''}</div>
              ${items.slice(0,3).map(item=>`
                <div class="cal-event-pill ${item.status}" title="${escAttr(item.topic)}" onclick="openItem('${item.id}')">${escHtml(item.topic.substring(0,22))}</div>
              `).join('')}
              ${items.length>3?`<div style="font-size:9px;color:var(--text-3);margin-top:2px;">+${items.length-3} más</div>`:''}
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

let _batchProgress = {}; // { id: 'pending'|'generating'|'done'|'error' }
let _batchMode = 'week'; // 'week' | 'all'

function renderGuiones() {
  const todayISO = fmtDateISO(new Date());
  const weekEnd = new Date();
  weekEnd.setDate(weekEnd.getDate() + 6);
  const weekEndISO = fmtDateISO(weekEnd);

  const allPending = state.items
    .filter(i => i.status !== 'published')
    .sort((a,b) => (a.scheduleDate||'zzz').localeCompare(b.scheduleDate||'zzz'));

  const weekItems = allPending.filter(i => i.scheduleDate && i.scheduleDate >= todayISO && i.scheduleDate <= weekEndISO);
  const items = _batchMode === 'week' ? weekItems : allPending.slice(0, 14);

  const withScript = items.filter(i => i.generated && Object.keys(i.generated).length > 0).length;
  const withoutScript = items.length - withScript;
  const hasKey = !!state.settings.claudeKey;

  return `
    <div class="page-header">
      <div class="page-header-inner">
        <div>
          <div class="page-title">Guiones por lote</div>
          <div class="page-sub">Genera el contenido de varias piezas de una sola vez</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary ${_batchMode==='week'?'active':''}" onclick="_batchMode='week';render()" style="${_batchMode==='week'?'border-color:var(--violet);color:var(--violet);':''}">Esta semana</button>
          <button class="btn btn-secondary ${_batchMode==='all'?'active':''}" onclick="_batchMode='all';render()" style="${_batchMode==='all'?'border-color:var(--violet);color:var(--violet);':''}">Próximos 14 días</button>
        </div>
      </div>
    </div>
    <div class="page-body">

      ${!hasKey ? `
        <div class="alert-banner orange" style="margin-bottom:20px;">
          <div class="ab-icon">⚠️</div>
          <div class="ab-text">
            <strong>Sin Claude API key.</strong> La generación usará plantillas inteligentes.
            <button class="btn btn-secondary btn-sm" style="margin-left:12px;" onclick="navigate('config')">Configurar key →</button>
          </div>
        </div>` : ''}

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:28px;font-weight:700;color:var(--violet);">${items.length}</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:4px;">Piezas en el período</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:28px;font-weight:700;color:var(--green);">${withScript}</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:4px;">Ya tienen guion</div>
        </div>
        <div class="card" style="text-align:center;padding:16px;">
          <div style="font-size:28px;font-weight:700;color:var(--orange);">${withoutScript}</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:4px;">Sin guion — pendientes</div>
        </div>
      </div>

      ${items.length === 0 ? `
        <div class="card" style="text-align:center;padding:48px;color:var(--text-3);">
          <div style="font-size:36px;margin-bottom:12px;">✓</div>

            <div style="display:flex;gap:8px;">

          ${items.map(item => {
            const hasGen = item.generated && Object.keys(item.generated).length > 0;

            else { statusIcon = '<span style="color:var(--text-3);font-size:11px;">sin guion</span>'; }

}

function selectAllBatch() {
  const unchecked = document.querySelectorAll('.batch-chk:not(:checked)');
  const checked = document.querySelectorAll('.batch-chk:checked');
  if (unchecked.length > 0) {
    unchecked.forEach(c => c.checked = true);
  } else {
    checked.forEach(c => c.checked = false);
  }
}

async function startBatchGeneration() {
  const selected = [...document.querySelectorAll('.batch-chk:checked')].map(c => c.value);
  if (selected.length === 0) { showToast('Selecciona al menos una pieza', 'error'); return; }

  const btn = document.getElementById('btn-batch-gen');
  if (btn) { btn.disabled = true; btn.textContent = '⟳ Generando…'; }

  const log = document.getElementById('batch-log');
  if (log) { log.style.display = 'block'; log.innerHTML = ''; }

  const addLog = (msg) => { if (log) { log.innerHTML += msg + '\n'; log.scrollTop = log.scrollHeight; } };

  addLog(`▶ Iniciando generación de ${selected.length} pieza(s)…\n`);

  for (const id of selected) {
    const item = state.items.find(i => i.id === id);
    if (!item) continue;

    _batchProgress[id] = 'generating';
    // Update row visually without full re-render
    const row = document.getElementById(`batch-row-${id}`);
    if (row) row.style.background = 'rgba(167,139,250,0.05)';

    addLog(`→ [${item.seedDay||'?'}] ${item.topic.substring(0,50)}…`);

    try {
      // Build a temporary wizardState-like object for this item
      const ws = {
        platforms: item.platforms || ['TikTok','Instagram'],
        goal: item.goal || 'educacion',
        topic: item.topic || '',
        rubro: item.rubro || '',
        keyMessage: item.keyMessage || item.topic,
        audience: item.audience || state.settings.audience,
        tone: item.tone || 'Profesional y cercano',
        cta: item.cta || `Escríbenos al WhatsApp ${state.settings.phone}`,
        hashtags: item.hashtags || '#ORASICLab #AppsAMedida #PymesPeru #TransformacionDigital',
        pilar: item.pilar || '',
        formato: item.formato || 'Silencioso'
      };

      const gen = await generateContentAsync(ws);
      item.generated = gen;
      item.updatedAt = new Date().toISOString();
      saveState();

      _batchProgress[id] = 'done';
      addLog(`   ✓ Guion generado para ${(item.platforms||[]).join(', ')}`);
    } catch(e) {
      _batchProgress[id] = 'error';
      addLog(`   ✕ Error: ${e.message}`);
    }

    // Small pause between API calls to avoid rate limits
    if (selected.indexOf(id) < selected.length - 1) {
      await new Promise(r => setTimeout(r, 800));
    }
  }

  addLog(`\n✅ Generación completada. ${selected.filter(id=>_batchProgress[id]==='done').length}/${selected.length} exitosas.`);
  if (btn) { btn.disabled = false; btn.textContent = '🤖 Generar seleccionados'; }
  showToast('✅ Guiones generados y guardados', 'success');
  render();
}

// ═══════════════════════════════════════════════════════════
//  RENDIMIENTO — evaluación de contenido publicado
// ═══════════════════════════════════════════════════════════
// Qué se pide al usuario. TikTok e Instagram no entregan estos datos por API
// sin backend + aprobación, así que se copian a mano desde la app (2 min).
// Los nombres calcan los de TikTok Studio → Estadísticas → (clic en el video),
// para copiarlos sin traducir nada mentalmente.
const METRIC_FIELDS = [
  { k:'views',    label:'Visualizaciones',      hint:'"Visualizaciones del vídeo"' },
  { k:'avgWatch', label:'Tiempo promedio (seg)',hint:'"Tiempo promedio de visualización" · ej. 4.37', step:'0.01' },
  { k:'duration', label:'Duración del video (seg)', hint:'Lo dice el estudio al generarlo · ej. 13' },
  { k:'likes',    label:'Me gusta',             hint:'' },
  { k:'comments', label:'Comentarios',          hint:'' },
  { k:'shares',   label:'Veces compartido',     hint:'Lo que más mueve el alcance' },
  { k:'saves',    label:'Guardados',            hint:'' },
  { k:'profile',  label:'Visitas al perfil',    hint:'Opcional — TikTok solo lo da por cuenta, no por video' },
  { k:'messages', label:'Mensajes recibidos',   hint:'Cuántos te escribieron por esta pieza' }
];

// Referencias generales, para usar solo mientras no haya historial propio:
// con 3 piezas o más, compararte con tu propia mediana dice mucho más.
// retention aquí es "cuánto del video aguantaron en promedio": por debajo de
// un cuarto del video, el gancho no está sosteniendo.
const BENCH = { retention:{bad:25}, engage:{bad:3}, share:{bad:0.5}, profileCtr:{bad:1} };

function calcRates(m){
  const v = Number(m.views)||0;
  const pct = n => v ? (Number(n)||0) * 100 / v : 0;
  const inter = (Number(m.likes)||0)+(Number(m.comments)||0)+(Number(m.shares)||0)+(Number(m.saves)||0);
  // Retención real = cuánto del video aguantaron, no el % que llegó al final.
  // "Vieron completo" castiga mucho a los videos largos y no es comparable entre
  // piezas de distinta duración; el promedio sobre la duración sí lo es.
  const dur = Number(m.duration)||0, avg = Number(m.avgWatch)||0;
  const retention = (dur > 0 && avg > 0) ? (avg / dur * 100) : (Number(m.retention)||0);
  return { views:v, retention, avgWatch:avg, duration:dur, engage:pct(inter), share:pct(m.shares),
           profileCtr:pct(m.profile), profile:Number(m.profile)||0, messages:Number(m.messages)||0 };
}

// Diagnóstico de embudo: devuelve la PRIMERA etapa que falla, porque arreglar
// una etapa posterior no sirve si la anterior sigue rota.
function diagnose(r, medianViews){
  if (r.retention && r.retention < BENCH.retention.bad)
    return { sev:'alta', etapa:'Gancho', dolor:'La gente se va en los primeros segundos.',
             fix:'Reescribe los primeros 3 segundos: abre con la pregunta o la cifra más incómoda, sin presentación ni logo.' };

  if (r.engage < BENCH.engage.bad)
    return { sev:'alta', etapa:'Interés', dolor:'Lo vieron pero no les movió nada.',
             fix:'El tema no le duele a tu público. Cambia el ángulo a un problema que reconozcan al instante.' };

  if (r.share < BENCH.share.bad)
    return { sev:'media', etapa:'Utilidad', dolor:'Les gustó, pero no es algo que quieran mandarle a otro.',
             fix:'Agrega algo aprovechable: un dato concreto, un error que casi todos cometen o una comparación que dé rabia.' };

  if (r.profile > 0 && r.profileCtr < BENCH.profileCtr.bad)
    return { sev:'media', etapa:'Curiosidad', dolor:'Gustó el contenido, pero nadie quiso saber quién lo hizo.',
             fix:'Falta autoridad: menciona un caso real o un resultado concreto para que valga la pena mirarte.' };

  if (r.profile >= 5 && r.messages === 0)
    return { sev:'alta', etapa:'Conversión', dolor:'Entraron a tu perfil y ninguno escribió.',
             fix:'El problema no es el video: revisa la bio y el CTA. Di exactamente qué pasa si escriben y por qué es sin compromiso.' };

  if (medianViews && r.views < medianViews * 0.6)
    return { sev:'media', etapa:'Distribución', dolor:'El contenido funciona, pero llegó a poca gente.',
             fix:'No es la pieza: prueba otro horario (12-13h o 19-21h Perú) y hashtags más específicos de rubro.' };

  if (r.messages > 0)
    return { sev:'ok', etapa:'Convierte', dolor:'',
             fix:'Esta pieza generó contacto real. Repite el ángulo y el rubro en las próximas.' };

  return { sev:'ok', etapa:'Sano', dolor:'',
           fix:'Sin cuello de botella claro. Sostén el formato y sube el volumen de publicación.' };
}

// Se mide cada red por separado: TikTok y Reels tienen públicos y comportamientos
// distintos, y promediarlos esconde que un mismo video vuele en una y muera en la otra.
const NETS_MEDIBLES = ['TikTok', 'Instagram'];

// Lee las métricas de una red. Migra el formato antiguo (plano = TikTok).
function getMetrics(item, net){
  if (!item.metrics) return null;
  if (item.metrics.views !== undefined){          // formato viejo, sin red
    item.metrics = { TikTok: item.metrics };
  }
  const m = item.metrics[net];
  return (m && Number(m.views) > 0) ? m : null;
}

function redesDe(item){
  return NETS_MEDIBLES.filter(n => (item.platforms||[]).includes(n));
}

// Punto único de guardado de métricas: además de dejar el snapshot "actual"
// (lo que usa el diagnóstico), acumula cada guardado en item.metrics[net].history
// para poder ver la evolución en el tiempo, no solo el último número.
function guardarSnapshot(item, net, datos){
  getMetrics(item, net); // fuerza la migración del formato viejo
  item.metrics = item.metrics || {};
  const cur = item.metrics[net] || {};
  const ahora = new Date().toISOString();
  const nuevo = { ...cur, ...datos, updatedAt: ahora };
  const hist = Array.isArray(cur.history) ? cur.history.slice() : [];
  hist.push({ date: ahora, views: nuevo.views, likes: nuevo.likes, comments: nuevo.comments, shares: nuevo.shares, saves: nuevo.saves });
  nuevo.history = hist;
  item.metrics[net] = nuevo;
}

// net opcional: sin él cuenta las piezas con datos en cualquier red.
// Las marcadas como "arranque" quedan fuera de promedios y comparaciones: en una
// cuenta nueva TikTok reparte un lote de prueba de 400-500 vistas que no refleja
// la calidad de la pieza, y mezclarlo distorsiona la línea base.
function itemsConMetricas(net, incluirArranque){
  return state.items.filter(i =>
    (incluirArranque || !i.excluirDeBase) &&
    (net ? getMetrics(i, net) : NETS_MEDIBLES.some(n => getMetrics(i, n))));
}

// Sin red: junta las vistas de todas las redes. Con red: solo esa.
function medianaVistas(net){
  const v = [];
  state.items.filter(i => !i.excluirDeBase).forEach(i => {
    (net ? [net] : NETS_MEDIBLES).forEach(n => {
      const m = getMetrics(i, n);
      if (m) v.push(Number(m.views));
    });
  });
  v.sort((a,b)=>a-b);
  if (v.length < 3) return 0;   // con menos de 3 mediciones una mediana no significa nada
  const mid = Math.floor(v.length/2);
  return v.length % 2 ? v[mid] : (v[mid-1]+v[mid])/2;
}

// Agrupa por dimensión (pilar, rubro, formato) y ordena por engagement medio
function agrupaPor(campo, net){
  const g = {};
  itemsConMetricas(net).forEach(i => {
    const k = i[campo] || '—';
    const targetNet = net || redesDe(i).find(n => getMetrics(i, n));
    const m = getMetrics(i, targetNet);
    if (!m) return;
    const r = calcRates(m);
    (g[k] = g[k] || { n:0, engage:0, views:0, messages:0 });
    g[k].n++; g[k].engage += r.engage; g[k].views += r.views; g[k].messages += r.messages;
  });
  return Object.entries(g).map(([k,v]) => ({
    clave:k, n:v.n, engage:v.engage/v.n, views:Math.round(v.views/v.n), messages:v.messages
  })).sort((a,b) => b.engage - a.engage);
}

// Resumen por red, para saber dónde conviene poner el esfuerzo
function resumenRedes(){
  return NETS_MEDIBLES.map(net => {
    const its = itemsConMetricas(net);
    if (!its.length) return { net, n:0 };
    const rs = its.map(i => calcRates(getMetrics(i, net)));
    const avg = k => rs.reduce((a,r)=>a+r[k],0)/rs.length;
    return { net, n:its.length, views:Math.round(avg('views')), engage:avg('engage'),
             share:avg('share'), messages:rs.reduce((a,r)=>a+r.messages,0) };
  }).filter(x => x.n > 0);
}

// Suma las métricas actuales (no el historial) de las piezas publicadas dentro
// de un rango de fechas — usado por el resumen semanal para comparar semana
// actual vs. anterior sin tener que recorrer el historial completo.
// Tarjeta de estadística reutilizable: número + etiqueta + explicación corta al
// costado, para que ningún indicador quede "mudo". extra es opcional (ej. un delta).
function statCard(num, label, caption, extra){
  return `
    <div class="stat-card">
      <div class="stat-num">${num}</div>
      <div class="stat-label">${label}</div>
      <div style="font-size:10px;color:var(--text-3);margin-top:2px;">${caption}</div>
      ${extra||''}
    </div>`;
}

// net es obligatorio aquí: el resumen semanal siempre compara red contra red,
// nunca mezclado, porque TikTok e Instagram tienen públicos distintos y sumarlos
// esconde cuál de las dos te está funcionando de verdad.
function sumaPeriodo(desde, hasta, net){
  const totales = { views:0, likes:0, comments:0, shares:0, saves:0, messages:0 };
  state.items.forEach(it => {
    if (it.status !== 'published') return;
    if (!redesDe(it).includes(net)) return;
    const d = it.scheduleDate;
    if (!d || d < desde || d > hasta) return;
    const m = getMetrics(it, net);
    if (!m) return;
    totales.views += Number(m.views)||0;
    totales.likes += Number(m.likes)||0;
    totales.comments += Number(m.comments)||0;
    totales.shares += Number(m.shares)||0;
    totales.saves += Number(m.saves)||0;
    totales.messages += Number(m.messages)||0;
  });
  return totales;
}

function openResumenSemanal(){
  const diaMs = 86400000;
  const hoy = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const finActual = iso(hoy);
  const inicioActual = iso(new Date(hoy.getTime() - 6*diaMs));
  const finAnterior = iso(new Date(hoy.getTime() - 7*diaMs));
  const inicioAnterior = iso(new Date(hoy.getTime() - 13*diaMs));

  const piezasSemana = state.items
    .filter(i => i.status === 'published' && i.scheduleDate >= inicioActual && i.scheduleDate <= finActual)
    .sort((a,b) => (b.scheduleDate||'').localeCompare(a.scheduleDate||''));

  const delta = (cur, prev) => {
    if (!prev) return cur > 0 ? `<div style="color:var(--green);font-size:11px;margin-top:4px;">nueva esta semana</div>` : '';
    const d = (cur - prev) / prev * 100;
    const color = d >= 0 ? 'var(--green)' : 'var(--pink)';
    return `<div style="color:${color};font-size:11px;margin-top:4px;">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}% vs. semana pasada</div>`;
  };

  const bloqueRed = (net) => {
    const piezasRed = piezasSemana.filter(i => redesDe(i).includes(net));
    if (!piezasRed.length) return '';
    const actual = sumaPeriodo(inicioActual, finActual, net);
    const anterior = sumaPeriodo(inicioAnterior, finAnterior, net);
    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card-title" style="margin-bottom:10px;">${platformIcon(net)} ${net}</div>
        <div class="stat-grid" style="margin-bottom:12px;">
          ${statCard(`<span style="color:var(--green);">${actual.messages}</span>`, 'Mensajes recibidos', 'El objetivo real: cuántas veces te escribieron a partir de esta red, esta semana.', delta(actual.messages, anterior.messages))}
          ${statCard(actual.views.toLocaleString('es'), 'Vistas', 'Reproducciones o alcance de tus piezas esta semana.', delta(actual.views, anterior.views))}
          ${statCard(actual.likes.toLocaleString('es'), 'Me gusta', 'Qué tanto conectó de inmediato con quien lo vio.', delta(actual.likes, anterior.likes))}
          ${statCard(actual.comments.toLocaleString('es'), 'Comentarios', 'Qué tanto generó conversación real.', delta(actual.comments, anterior.comments))}
          ${statCard(piezasRed.length, 'Piezas esta semana', `Cuánto publicaste en ${net} esta semana.`)}
        </div>
        ${piezasRed.map(i => {
          const m = getMetrics(i, net);
          const fecha = i.scheduleDate ? fmtDate(new Date(i.scheduleDate+'T12:00')) : '';
          return `
            <div class="perf-row">
              <div class="perf-main">
                <div class="perf-title">${escHtml((i.topic||'').slice(0,80))}</div>
                <div class="perf-meta">${fecha}${i.rubro?' · '+escHtml(i.rubro):''}</div>
                ${m ? (() => { const r = calcRates(m); return `<div class="perf-net"><div class="perf-nums"><span>👁 ${r.views.toLocaleString('es')}</span><span>💬 ${r.engage.toFixed(1)}%</span>${r.messages?`<span style="color:var(--green);font-weight:700;">✉ ${r.messages}</span>`:''}</div></div>`; })()
                   : `<div class="perf-falta">Sin datos cargados todavía en ${net}</div>`}
              </div>
            </div>`;
        }).join('')}
      </div>`;
  };

  const bloques = NETS_MEDIBLES.map(bloqueRed).join('');

  const ov = document.createElement('div');
  ov.className = 'vs-overlay';
  ov.innerHTML = `
    <div class="vs-modal" style="max-width:680px;">
      <div class="vs-head">
        <div class="vs-title">📅 Resumen de la semana</div>
        <button class="btn btn-secondary btn-sm" id="rs-close">✕</button>
      </div>
      <div class="vs-sub">${fmtDate(new Date(inicioActual+'T12:00'))} – ${fmtDate(new Date(finActual+'T12:00'))} · cada red por separado, no se mezclan</div>
      ${!piezasSemana.length ? `
        <div class="card" style="text-align:center;padding:30px;margin-top:14px;">
          <div style="font-size:26px;margin-bottom:8px;">🌙</div>
          <div style="font-weight:700;">No publicaste nada esta semana</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:4px;">En cuanto publiques y cargues números, este resumen se llena solo.</div>
        </div>` : (bloques || `<div class="perf-falta" style="margin-top:14px;">Ninguna pieza de esta semana está asignada a TikTok o Instagram.</div>`)}
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#rs-close').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
}

function renderRendimiento(){
  const publicadas = state.items
    .filter(i => i.status === 'published')
    .sort((a,b) => (b.scheduleDate||'').localeCompare(a.scheduleDate||''));
  const conM = itemsConMetricas();
  const med = medianaVistas();

  const ayudaRendimiento = `
    <details class="card" style="margin-bottom:16px;">
      <summary style="cursor:pointer;font-weight:700;font-size:13px;">❓ ¿Cómo funciona esta pestaña?</summary>
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.65;margin-top:10px;">
        <div style="margin-bottom:8px;"><b style="color:var(--text-1);">Qué mide:</b> el rendimiento real de lo publicado en TikTok e Instagram — vistas, likes, comentarios, guardados, compartidos — y detecta en qué etapa se traba cada pieza (Gancho → Interés → Utilidad → Curiosidad → Conversión), no solo si "le fue bien o mal".</div>
        <div style="margin-bottom:4px;"><b style="color:var(--text-1);">Cómo cargar los números:</b></div>
        <ul style="margin:0 0 8px 18px;padding:0;">
          <li><b>🔄 Sincronizar Instagram</b> — trae tus datos automáticamente vía API, sin copiar nada.</li>
          <li><b>📋 Pegar tabla de TikTok</b> — copias la tabla de TikTok Studio y la app la interpreta sola.</li>
          <li><b>📥 Cargar semana</b> — carga manual, pieza por pieza, para lo que falte de cualquier red.</li>
        </ul>
        <div style="margin-bottom:8px;"><b style="color:var(--text-1);">📅 Resumen semanal:</b> compara los últimos 7 días contra los 7 anteriores, <b>siempre separado por red</b> (nunca mezcla TikTok con Instagram). Cada número trae su explicación al costado.</div>
        <div><b style="color:var(--text-1);">Historial:</b> cada vez que actualizas los números de una pieza queda un registro con fecha — se ve dentro de "✎ Editar" de esa pieza, una vez que tenga más de un guardado.</div>
      </div>
    </details>`;

  if (!publicadas.length) return `
    <div class="page-head"><div><h1>Rendimiento</h1><p>Evalúa lo publicado y detecta qué corregir</p></div></div>
    ${ayudaRendimiento}
    <div class="card" style="text-align:center;padding:40px;">
      <div style="font-size:30px;margin-bottom:10px;">📊</div>
      <div style="font-weight:700;margin-bottom:6px;">Aún no hay piezas publicadas</div>
      <div style="font-size:13px;color:var(--text-2);">Marca una pieza como <b>✓ Publicado</b> en el Banco y vuelve aquí para cargar sus números.</div>
    </div>`;

  const redes = resumenRedes();
  const pendientes = publicadas.filter(i => redesDe(i).some(n => !getMetrics(i, n)));

  return `
    <div class="page-head">
      <div><h1>Rendimiento</h1><p>${publicadas.length} publicadas · ${conM.length} con datos cargados</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="openResumenSemanal()">📅 Resumen semanal</button>
        <button class="btn btn-secondary" onclick="openInstagramSync()">🔄 Sincronizar Instagram</button>
        <button class="btn btn-secondary" onclick="openTikTokPaste()">📋 Pegar tabla de TikTok</button>
        ${pendientes.length ? `<button class="btn btn-primary" onclick="openMetricsQueue()">📥 Cargar semana (${pendientes.length})</button>` : ''}
      </div>
    </div>

    ${ayudaRendimiento}

    ${conM.length < 3 ? `
      <div class="card" style="border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.05);margin-bottom:16px;">
        <div style="font-size:13px;">
          <b>Estás empezando a medir.</b> Con ${conM.length} pieza${conM.length===1?'':'s'} el diagnóstico usa referencias generales.
          Desde la <b>tercera</b>, cada video se compara contra tu propio promedio, que es mucho más fiable.
        </div>
      </div>` : NETS_MEDIBLES.map(net => {
        const its = itemsConMetricas(net);
        if (!its.length) return '';
        let v = 0, msg = 0;
        its.forEach(i => { const m = getMetrics(i, net); v += Number(m.views)||0; msg += Number(m.messages)||0; });
        const infoRed = redes.find(r => r.net === net);
        const engagePromedio = infoRed ? infoRed.engage : 0;
        const engageOk = engagePromedio >= BENCH.engage.bad;
        return `
          <div class="card" style="margin-bottom:12px;">
            <div class="card-title" style="margin-bottom:10px;">${platformIcon(net)} ${net}</div>
            <div class="stat-grid">
              ${statCard(`<span style="color:var(--green);">${msg}</span>`, 'Mensajes generados', 'Cuántas veces alguien te escribió a partir de una pieza de esta red — la métrica que de verdad importa.')}
              ${statCard(v.toLocaleString('es'), 'Vistas acumuladas', `Suma de vistas de todas tus piezas medidas en ${net}.`)}
              ${statCard(`<span style="color:${engageOk?'var(--green)':'var(--pink)'};">${engagePromedio.toFixed(1)}%</span>`, 'Engagement promedio', `Meta: ≥ ${BENCH.engage.bad}%. (me gusta+comentarios+compartidos+guardados) ÷ vistas. Por debajo, el tema no está conectando.`)}
              ${statCard(its.length, 'Piezas medidas', `Cuántas piezas de ${net} ya tienen números cargados.`)}
            </div>
          </div>`;
      }).join('')}

    <details class="card" style="margin-bottom:16px;">
      <summary style="cursor:pointer;font-weight:700;font-size:13px;">🎯 Tus metas por indicador (lo que ya usa el diagnóstico)</summary>
      <div style="font-size:12px;color:var(--text-2);line-height:1.7;margin-top:10px;">
        <div style="margin-bottom:6px;"><b style="color:var(--text-1);">Retención ≥ ${BENCH.retention.bad}%</b> — tiempo promedio visto ÷ duración del video. Por debajo, el gancho de los primeros 3 segundos no está funcionando.</div>
        <div style="margin-bottom:6px;"><b style="color:var(--text-1);">Engagement ≥ ${BENCH.engage.bad}%</b> — (me gusta+comentarios+compartidos+guardados) ÷ vistas. Por debajo, el tema no le duele/interesa a tu público.</div>
        <div style="margin-bottom:6px;"><b style="color:var(--text-1);">Compartidos ≥ ${BENCH.share.bad}%</b> — veces compartido ÷ vistas. Por debajo, gustó pero no es algo que quieran reenviar.</div>
        <div><b style="color:var(--text-1);">Visitas a perfil ≥ ${BENCH.profileCtr.bad}%</b> — visitas al perfil ÷ vistas. Por debajo, no genera curiosidad de saber quién lo hizo (y sin eso, no llegan mensajes).</div>
      </div>
    </details>

    ${redes.length >= 2 ? `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title" style="margin-bottom:10px;">¿Dónde te está funcionando?</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          ${redes.map(x=>`
            <div class="net-card">
              <div class="net-name">${platformIcon(x.net)} ${x.net}</div>
              <div class="net-stat"><span>Vistas promedio</span><b>${x.views.toLocaleString('es')}</b></div>
              <div class="net-stat"><span>Engagement</span><b>${x.engage.toFixed(1)}%</b></div>
              <div class="net-stat"><span>Compartidos</span><b>${x.share.toFixed(1)}%</b></div>
              <div class="net-stat"><span>Mensajes</span><b style="color:var(--green);">${x.messages}</b></div>
              <div style="font-size:10.5px;color:var(--text-3);margin-top:6px;">${x.n} pieza${x.n===1?'':'s'} medida${x.n===1?'':'s'}</div>
            </div>`).join('')}
        </div>
        ${redes.length===2 ? `<div class="strat-note" style="margin-top:12px;">
          ${redes[0].engage > redes[1].engage * 1.3
            ? `Tu contenido rinde claramente mejor en <b>${redes[0].net}</b>. Si tuvieras que elegir dónde concentrar el esfuerzo, es ahí.`
            : redes[1].engage > redes[0].engage * 1.3
            ? `Tu contenido rinde claramente mejor en <b>${redes[1].net}</b>. Si tuvieras que elegir dónde concentrar el esfuerzo, es ahí.`
            : `Las dos redes te rinden parecido. Mantén ambas y decide por dónde llegan los mensajes, no por las vistas.`}
        </div>` : ''}
      </div>` : ''}

    ${conM.length >= 3 ? renderEstrategiaDatos() : ''}

    <div class="card">
      <div class="card-title" style="margin-bottom:12px;">Piezas publicadas</div>
      ${publicadas.map(i => {
        const fecha = i.scheduleDate ? fmtDate(new Date(i.scheduleDate+'T12:00')) : '';
        const nets = redesDe(i);
        const conDatos = nets.filter(n => getMetrics(i, n));
        const cab = `
          <div class="perf-title">${escHtml((i.topic||'').slice(0,80))}</div>
          <div class="perf-meta">${fecha} · ${escHtml(i.rubro||'')} · ${escHtml(i.pilar||'')}${

        if (!conDatos.length) return `
          <div class="perf-row">
            <div class="perf-main">${cab}</div>
            <button class="btn btn-primary btn-sm" onclick="openMetrics('${i.id}')">＋ Cargar números</button>
          </div>`;

        const peor = conDatos.map(n => diagnose(calcRates(getMetrics(i,n)), medianaVistas(n)))
          .sort((a,b)=> ({alta:0,media:1,ok:2})[a.sev] - ({alta:0,media:1,ok:2})[b.sev])[0];
        const clsRow = peor.sev==='alta' ? 'sev-alta' : peor.sev==='media' ? 'sev-media' : 'sev-ok';

        return `
          <div class="perf-row ${clsRow}">
            <div class="perf-main">
              ${cab}
              ${conDatos.map(n => {
                const r = calcRates(getMetrics(i, n));
                const d = diagnose(r, medianaVistas(n));
                const cls = d.sev==='alta' ? 'sev-alta' : d.sev==='media' ? 'sev-media' : 'sev-ok';
                return `
                  <div class="perf-net">
                    <div class="perf-nums">
                      <span class="perf-netname">${platformIcon(n)} ${n}</span>
                      <span>👁 ${r.views.toLocaleString('es')}</span>
                      ${r.retention?`<span>⏱ ${r.retention}%</span>`:''}
                      <span>💬 ${r.engage.toFixed(1)}%</span>
                      <span>↗ ${r.share.toFixed(1)}%</span>
                      ${r.messages?`<span style="color:var(--green);font-weight:700;">✉ ${r.messages}</span>`:''}
                    </div>
                    <div class="perf-diag">
                      <span class="perf-tag ${cls}">${d.etapa}</span>
                      ${d.dolor?`<b>${escHtml(d.dolor)}</b> `:''}${escHtml(d.fix)}
                    </div>
                  </div>`;
              }).join('')}
              ${nets.filter(n=>!getMetrics(i,n)).map(n=>`
                <div class="perf-falta">${platformIcon(n)} ${n} — sin datos cargados</div>`).join('')}
            </div>
            <button class="btn btn-secondary btn-sm" onclick="openMetrics('${i.id}')">✎ Editar</button>
          </div>`;
      }).join('')}
    </div>`;
}

// Lectura de estrategia: qué funciona de verdad vs. lo que planificaste
function renderEstrategiaDatos(){
  const porPilar = agrupaPor('pilar'), porRubro = agrupaPor('rubro'), porFormato = agrupaPor('formato');
  const mejor = porPilar[0], peor = porPilar[porPilar.length-1];
  const conv = itemsConMetricas().filter(i =>
    NETS_MEDIBLES.some(n => { const m = getMetrics(i, n); return m && Number(m.messages) > 0; }));

  const planPorPilar = {};
  state.items.forEach(i => { const k=i.pilar||'—'; planPorPilar[k]=(planPorPilar[k]||0)+1; });

  const avisos = [];
  if (porPilar.length >= 2 && mejor.engage > peor.engage * 1.5)
    avisos.push(`Tu pilar <b>${escHtml(mejor.clave)}</b> rinde ${(mejor.engage/Math.max(peor.engage,0.1)).toFixed(1)}× más que <b>${escHtml(peor.clave)}</b>. Conviene cargar el calendario hacia el primero.`);
  if (porFormato.length >= 2)
    avisos.push(`El formato <b>${escHtml(porFormato[0].clave)}</b> te está funcionando mejor (${porFormato[0].engage.toFixed(1)}% vs ${porFormato[1].engage.toFixed(1)}%).`);
  if (conv.length)
    avisos.push(`Las piezas que <b>sí generaron mensajes</b> son de rubro ${conv.map(i=>'<b>'+escHtml(i.rubro||'—')+'</b>').join(', ')}. Ese es tu terreno: repítelo.`);
  else
    avisos.push(`Todavía ninguna pieza generó mensajes. Si se mantiene así, el problema no es el contenido sino el <b>CTA y la bio</b>: revisa qué ve alguien que entra a tu perfil.`);
  const sinDatos = Object.keys(planPorPilar).filter(k => !porPilar.some(p=>p.clave===k));
  if (sinDatos.length)
    avisos.push(`Aún sin medir: ${sinDatos.map(p=>escHtml(p)).join(', ')}. No saques conclusiones de esos pilares todavía.`);

  const tabla = (titulo, arr) => `
    <div style="flex:1;min-width:210px;">
      <div style="font-size:10px;font-weight:700;color:var(--violet);letter-spacing:.07em;margin-bottom:6px;">${titulo}</div>
      ${arr.slice(0,4).map(x=>`
        <div class="strat-row">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(x.clave)}</span>
          <span style="color:var(--text-3);font-size:11px;">${x.n}×</span>
          <b style="color:var(--cyan);min-width:44px;text-align:right;">${x.engage.toFixed(1)}%</b>
        </div>`).join('')}
    </div>`;

  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title" style="margin-bottom:10px;">¿La estrategia va bien?</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;">
        ${tabla('POR PILAR', porPilar)}${tabla('POR RUBRO', porRubro)}${tabla('POR FORMATO', porFormato)}
      </div>
      ${avisos.map(a=>`<div class="strat-note">${a}</div>`).join('')}
    </div>`;
}

// Abrir la red es la señal de que vas a publicar: se marca sola y queda un
// "deshacer" por si solo entraste a mirar.
function irARed(url, itemId){
  window.open(url, '_blank', 'noopener');
  const it = itemId && state.items.find(i => i.id === itemId);
  if (!it || it.status === 'published') return;
  it._prevStatus = it.status;
  it.status = 'published';
  it.publishedAt = new Date().toISOString();
  saveState();
  if (typeof showToast === 'function') showToast('✅ Marcada como publicada','success');
  const undo = document.createElement('div');
  undo.className = 'undo-bar';
  undo.innerHTML = `<span>Marcada como publicada</span><button onclick="deshacerPublicado('${it.id}')">Deshacer</button>`;
  document.body.appendChild(undo);
  setTimeout(() => undo.remove(), 8000);
}

function deshacerPublicado(id){
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  it.status = it._prevStatus || 'ready';
  delete it._prevStatus; delete it.publishedAt;
  saveState();
  document.querySelectorAll('.undo-bar').forEach(e => e.remove());
  if (typeof showToast === 'function') showToast('Se deshizo la marca','success');
  render();
}
