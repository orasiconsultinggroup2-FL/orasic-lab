<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Video ORASIC Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080A0F;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #F9FAFB;
      margin-bottom: 20px;
      text-align: center;
      font-size: 22px;
    }
    video {
      width: 100%;
      border: 2px solid #A78BFA;
      border-radius: 12px;
      background: #000;
    }
    .info {
      color: #9CA3AF;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
    }
    .specs {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      color: #F9FAFB;
      font-size: 12px;
    }
    .specs div {
      margin: 5px 0;
    }
    .label { color: #A78BFA; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Preview Video - ORASIC Lab Carousel</h1>
    <video controls width="100%">
      <source src="orasic_lab_carousel_video_1.mp4" type="video/mp4">
      Tu navegador no soporta reproducción de video.
    </video>
    <div class="info">
      <p>Archivo: orasic_lab_carousel_video_1.mp4</p>
      <p>5 escenas: Hook → Problema → Solución → Prueba → CTA</p>
    </div>
    <div class="specs">
      <div><span class="label">Tamaño:</span> 3.1 MB</div>
      <div><span class="label">Formato:</span> MP4</div>
      <div><span class="label">Escenas:</span> 5 (PNG incluidas)</div>
      <div><span class="label">Plaforma:</span> TikTok, Instagram Reels, YouTube Shorts</div>
    </div>
  </div>
</body>
</html>
